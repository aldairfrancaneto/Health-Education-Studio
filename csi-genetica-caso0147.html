<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSI Genética: O Mistério da Herança — Caso 0147</title>
<!--
================================================================================
  CSI GENÉTICA: O MISTÉRIO DA HERANÇA · CASO 0147: A EVIDÊNCIA QUE FALTAVA
  Atividade presencial colaborativa. Arquivo único, offline, dados fictícios.

  FLUXO: Tela-título retrô (PRESS START) → Fake load "CARREGANDO" (5 s) →
         Seleção de papel → Prólogo → 5 fases → Parecer.

  MECÂNICAS PRESERVADAS: dois modos (Principal/Auxiliar), códigos de ETAPA e de
  RESPOSTA, votação/decisão coletiva, campo de código do professor, validação
  com animação, pontuação (teto 500), vídeos opcionais, responsividade, offline.
  Os códigos letra→código são FIXOS nos dados (multi-dispositivo sem rede).

  ONDE EDITAR (bloco JS ao final): CONFIG, VIDEOS, ROTULOS, PROLOGO, FASES,
  INTERSTICIOS, DIAS/dayFor, RANKS. Cada bloco narrativo usa o helper b(tipo,texto,rótulo).

  ESTA ATUALIZAÇÃO:
  • Tela-título retrô + fake load de 5 s.
  • Seleção de papel com pedido explícito ao jogador.
  • Central de Decisão sem sugestão de código.
  • Falas reveladas uma de cada vez (clique do mouse ou tecla Espaço/Enter/→).
  • Falas em 17 px, justificadas.
  • Voz ◈ PESQUISADOR PRINCIPAL em amarelo, sempre dirigindo-se aos auxiliares.
  • Sistema de dicas REMOVIDO.
  • Código de etapa dentro de uma guia expansiva que inicia CONTRAÍDA.
  • Botão de Dossiê REMOVIDO.
  • No erro: nada é revelado (nem a resposta nem dica) — só o aviso p/ escolher outra.
  • Botão "trocar papel" REMOVIDO do modo Auxiliar.
================================================================================
-->
<style>
  :root{
    --navy-900:#0a1424; --navy-800:#0f1e34; --navy-700:#152741;
    --navy-600:#1d3556; --graphite:#243b5e;
    --ink:#eef3fb; --ink-dim:#c2d2e8; --ink-faint:#7a90b2;
    --cyan:#38d6ff; --cyan-deep:#0e94c4;
    --evi:#ffd23f; --ok:#3ee08f; --no:#ff7a59;
    --principal:#FFE23D;               /* voz do Pesquisador Principal (amarelo) */
    --line:rgba(120,160,210,.18); --focus:#7fe9ff;
    --radius:12px; --shadow:0 10px 30px rgba(0,0,0,.45);
    --mono:ui-monospace,"SFMono-Regular","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;
    background:radial-gradient(1200px 600px at 15% -10%,rgba(56,214,255,.10),transparent 60%),
      radial-gradient(900px 500px at 110% 20%,rgba(29,53,86,.55),transparent 55%),var(--navy-900);min-height:100vh}
  a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(rgba(56,214,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(56,214,255,.035) 1px,transparent 1px);
    background-size:44px 44px;mask-image:radial-gradient(circle at 50% 30%,#000,transparent 85%)}
  .app{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:16px}

  /* ============================ TELAS RETRÔ =============================== */
  .retro-screen{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;padding:40px 20px;position:relative;cursor:pointer}
  .scanlines::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px);opacity:.45;border-radius:14px}
  .pixel-dna{font-size:2.6rem;line-height:1}
  .retro-case{font-family:var(--mono);letter-spacing:5px;color:var(--evi);text-transform:uppercase;font-size:.8rem}
  .retro-title{font-family:var(--mono);text-transform:uppercase;letter-spacing:6px;font-weight:800;color:var(--cyan);
    text-shadow:3px 3px 0 rgba(14,148,196,.7),0 0 14px rgba(56,214,255,.45);font-size:clamp(1.7rem,6vw,3.1rem);line-height:1.35}
  .retro-sub{font-family:var(--mono);letter-spacing:3px;color:var(--ink);text-transform:uppercase;font-size:clamp(.8rem,2.6vw,1.15rem)}
  .press-start{margin-top:10px;font-family:var(--mono);letter-spacing:5px;color:#fff;text-transform:uppercase;font-weight:800;
    font-size:clamp(1.05rem,3.2vw,1.5rem);animation:blink 1s steps(1) infinite}
  .retro-foot{font-family:var(--mono);font-size:.7rem;color:var(--ink-faint);letter-spacing:1px}
  @keyframes blink{50%{opacity:0}}
  /* Fake load */
  .load-title{font-family:var(--mono);letter-spacing:6px;text-transform:uppercase;color:var(--cyan);font-weight:800;
    font-size:clamp(1.2rem,4vw,2rem);animation:blink 1.1s steps(1) infinite}
  .load-bar{width:min(440px,82vw);height:26px;border:3px solid var(--cyan-deep);background:#08111f;padding:3px;box-shadow:0 0 0 3px #0a1424,0 0 18px rgba(56,214,255,.25)}
  .load-fill{height:100%;width:0%;background:repeating-linear-gradient(90deg,var(--cyan) 0 12px,var(--cyan-deep) 12px 16px)}
  .load-pct{font-family:var(--mono);color:var(--ink);letter-spacing:3px;font-size:1.1rem}
  .load-tip{font-family:var(--mono);color:var(--ink-faint);letter-spacing:1px;font-size:.72rem;max-width:520px}

  /* =============================== HUD =================================== */
  header.hud{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(10,20,36,.96),rgba(10,20,36,.82));
    backdrop-filter:blur(6px);border-bottom:1px solid var(--line);border-radius:0 0 var(--radius) var(--radius);padding:10px 14px;margin-bottom:16px}
  .hud-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .glyph{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--navy-900);
    background:linear-gradient(135deg,var(--cyan),var(--cyan-deep));box-shadow:0 0 0 1px rgba(56,214,255,.4),0 6px 16px rgba(56,214,255,.25);font-weight:800}
  .brand .case{font-family:var(--mono);font-size:.62rem;color:var(--cyan);letter-spacing:1.5px;text-transform:uppercase}
  .brand .role-tag{color:var(--ink-faint)}
  .brand h1{font-size:1rem;margin:0;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hud-spacer{flex:1 1 auto}
  .btn-fullscreen{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(56,214,255,.45);border-radius:8px;padding:7px 10px;
    background:rgba(56,214,255,.08);color:var(--cyan);font:700 .68rem var(--mono);letter-spacing:.7px;text-transform:uppercase}
  .btn-fullscreen:hover{background:rgba(56,214,255,.18)}
  .fullscreen-control{position:fixed;top:14px;right:16px;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.28)}
  .stat{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--mono);line-height:1.1}
  .stat .k{font-size:.6rem;color:var(--ink-faint);letter-spacing:1.5px;text-transform:uppercase}
  .stat .v{font-size:1.05rem;font-weight:700}.stat .v b{color:var(--cyan)}
  .progress-wrap{margin-top:10px}
  .progress-label{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:.66rem;color:var(--ink-faint);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
  .progress-track{height:8px;border-radius:999px;background:var(--navy-700);overflow:hidden;border:1px solid var(--line)}
  .progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--cyan-deep),var(--cyan));box-shadow:0 0 12px rgba(56,214,255,.6);transition:width .55s cubic-bezier(.22,1,.36,1)}
  .status-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.66rem;letter-spacing:.5px;padding:4px 10px;border-radius:999px;background:var(--navy-700);color:var(--ink-faint);border:1px solid var(--line);transition:.3s}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);transition:.3s}
  .chip.on{color:var(--ok);border-color:rgba(62,224,143,.4);background:rgba(62,224,143,.08)}
  .chip.on .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}

  /* ============================== Cartões ================================ */
  .panel{background:linear-gradient(180deg,var(--navy-800),var(--navy-700));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:16px;animation:rise .4s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--cyan);margin:0 0 6px}
  h2.title{font-size:1.45rem;margin:0 0 12px;letter-spacing:.2px}
  .prompt{font-size:1.2rem;font-weight:600;margin:14px 0}

  /* ===================  COMPONENTE DE DIÁLOGO (reutilizável)  ============ */
  .dialogo{display:flex;flex-direction:column;gap:5px;border-left:4px solid var(--c);border-radius:0 10px 10px 0;
    padding:12px 16px;margin:0 0 10px;background:var(--cbg);animation:rise .28s ease both}
  /* Rótulo do falante = crachá preenchido na cor do emissor, com ícone + nome.
     Deixa inconfundível QUEM está falando (narrador, sistema, personagem, etc.). */
  .dialogo .rotulo{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;
    background:var(--c);color:#0a1424;font-family:var(--mono);font-size:.74rem;letter-spacing:1px;
    font-weight:800;text-transform:uppercase;padding:5px 13px;border-radius:999px;box-shadow:0 1px 0 rgba(0,0,0,.25)}
  /* Falas e narração: fonte maior (17 px) e texto justificado */
  .dialogo p{margin:0;color:var(--ink);font-size:17px;line-height:1.6;text-align:justify}
  .narrador p{color:#FFFFFF}
  .narrador   {--c:#FFFFFF;--cbg:rgba(255,255,255,.07)}
  .documento  {--c:#FFD98A;--cbg:rgba(255,217,138,.08)}
  .validado   {--c:#38D996;--cbg:rgba(56,217,150,.10)}
  .reavaliar  {--c:#FFB45B;--cbg:rgba(255,180,91,.10)}
  .alerta     {--c:#FF7070;--cbg:rgba(255,112,112,.10)}
  /* Voz do Pesquisador Principal — destaque sem identidade pessoal definida */
  .principal  {--c:#FFD54A;--cbg:rgba(255,213,74,.12);border-left-width:5px;box-shadow:0 0 0 1px rgba(255,213,74,.32)}
  .principal p{color:#FFF1A6;font-weight:600}
  .aurora-status{margin:0 0 10px;padding:8px 12px;border:1px solid rgba(64,217,255,.36);border-radius:7px;
    background:rgba(64,217,255,.06);color:#40D9FF;font-family:var(--mono);font-size:.76rem;letter-spacing:.8px;font-weight:800}

  /* Indicador "pressione para continuar" */
  .seq-next{margin-top:6px}
  .seq-cue{font-family:var(--mono);font-size:.72rem;color:var(--cyan);letter-spacing:1px;margin-top:2px;animation:blink 1.1s steps(1) infinite}

  /* ============================ Alternativas ============================= */
  .options{display:grid;gap:10px;margin:0 0 6px}
  .opt{display:flex;align-items:stretch;width:100%;min-height:66px;text-align:left;background:var(--navy-700);color:var(--ink);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .opt .letter{flex:0 0 50px;display:grid;place-items:center;background:var(--graphite);color:var(--cyan);font-family:var(--mono);font-weight:800;font-size:1.1rem;border-right:1px solid var(--line)}
  .opt .body{display:flex;align-items:center;padding:12px 16px;font-size:1rem}
  .opt.correct{border-color:var(--ok);background:rgba(62,224,143,.16);box-shadow:0 0 0 2px var(--ok)}
  .opt.correct .letter{background:#1f8f5b;color:#eafff4}
  .opt.wrong{border-color:var(--no);background:rgba(255,122,89,.16);box-shadow:0 0 0 2px var(--no)}
  .opt.single-choice{cursor:pointer;text-align:left;font:inherit}
  .opt.single-choice:hover{border-color:var(--cyan);background:rgba(56,214,255,.08)}
  .opt.selected{border-color:var(--evi);background:rgba(255,210,63,.13);box-shadow:0 0 0 2px rgba(255,210,63,.5)}
  .single-confirm{margin:14px 0;padding:12px 14px;border:1px solid rgba(255,210,63,.38);border-radius:10px;background:rgba(255,210,63,.07);color:#ffe9a6}
  .opt.wrong .letter{background:#c2452c;color:#fff1ec}
  .opt.dim{opacity:.4}
  pre.seq{font-family:var(--mono);background:var(--navy-800);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;color:var(--cyan);font-size:.95rem;margin:0 0 14px}

  /* =============== Guia expansiva do código de etapa (contraída) ========= */
  details.etapa{margin-top:16px;border:1px dashed rgba(56,214,255,.4);border-radius:10px;background:rgba(56,214,255,.05);overflow:hidden}
  details.etapa>summary{cursor:pointer;list-style:none;padding:12px 14px;font-family:var(--mono);font-size:.8rem;color:var(--ink-dim);letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  details.etapa>summary::-webkit-details-marker{display:none}
  details.etapa>summary::before{content:"🔒";}
  details.etapa[open]>summary::before{content:"🔓";}
  details.etapa[open]>summary{color:var(--cyan);border-bottom:1px dashed rgba(56,214,255,.3)}
  .etapa-inner{padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .etapa-inner .lbl{font-family:var(--mono);font-size:.78rem;color:var(--ink-dim)}
  .etapa-inner .code{font-family:var(--mono);font-weight:800;letter-spacing:3px;font-size:1.25rem;color:var(--cyan);background:var(--navy-800);border:1px solid var(--line);border-radius:8px;padding:5px 16px}

  /* ========================= Campo de decisão =========================== */
  .decision{margin-top:18px;padding:16px;border-radius:12px;background:var(--navy-800);border:1px solid var(--line)}
  .decision .d-label{font-family:var(--mono);font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px}
  .d-row{display:flex;gap:10px;flex-wrap:wrap}
  input.code-input{flex:1 1 240px;min-width:0;background:var(--navy-700);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:var(--mono);font-size:1.05rem;letter-spacing:2px;padding:13px 14px;text-transform:uppercase}
  input.code-input::placeholder{color:var(--ink-faint);letter-spacing:.5px;text-transform:none;font-size:.9rem}
  input.code-input:disabled{opacity:.5}

  /* ============================== Botões ================================= */
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;border:1px solid transparent;transition:.16s;letter-spacing:.2px}
  .btn-primary{background:linear-gradient(135deg,var(--cyan),var(--cyan-deep));color:var(--navy-900);box-shadow:0 6px 18px rgba(56,214,255,.28)}
  .btn-primary:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px)}
  .btn-ghost{background:var(--navy-700);color:var(--ink);border-color:var(--line)}
  .btn-ghost:hover:not(:disabled){background:var(--navy-600);border-color:var(--cyan-deep)}
  .btn-video{background:transparent;color:var(--cyan);border-color:rgba(56,214,255,.45)}
  .btn-video:hover:not(:disabled){background:rgba(56,214,255,.1)}
  .btn:disabled{opacity:.5;cursor:default}

  /* ===================== Reveal / processamento ========================= */
  .answer-reveal{margin:6px 0 12px;padding:14px 16px;border-radius:10px;font-weight:800;font-family:var(--mono);letter-spacing:.5px}
  .answer-reveal.correct{background:rgba(62,224,143,.16);border:1px solid var(--ok);color:#c9ffe6}
  .answer-reveal.wrong{background:rgba(255,112,112,.14);border:1px solid var(--no);color:#ffd9d0}
  .answer-reveal .big{font-size:1.15rem}
  .pts{font-family:var(--mono);font-size:.9rem;color:var(--ok);margin-top:8px}
  .processing{margin-top:16px;padding:18px;border-radius:12px;background:var(--navy-800);border:1px solid var(--line);text-align:center}
  .proc-msg{font-family:var(--mono);color:var(--cyan);font-size:.95rem;min-height:1.4em}
  .scanner{height:6px;border-radius:999px;background:var(--navy-700);overflow:hidden;margin-top:12px;position:relative}
  .scanner::after{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:scan 1s linear infinite}
  @keyframes scan{to{left:100%}}

  /* ====================== Seleção de papel ============================== */
  .home{text-align:center;padding:34px 22px}
  .home .dna{font-size:2.6rem;line-height:1;margin-bottom:6px}
  .home .case-name{font-family:var(--mono);color:var(--evi);letter-spacing:2px;font-size:.8rem;text-transform:uppercase;margin-bottom:6px}
  .home h2.title{font-size:1.9rem;margin-bottom:6px}
  .home .subtitle{color:var(--ink-dim);max-width:660px;margin:0 auto;font-size:1.05rem}
  .home .pick{margin:20px auto 4px;font-family:var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--cyan);font-size:.95rem}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0 8px}
  .role-card{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;background:var(--navy-700);border:1px solid var(--line);border-radius:14px;padding:26px 18px;color:inherit;font:inherit;transition:.18s}
  .role-card:hover{border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 8px 22px rgba(56,214,255,.18)}
  .role-card .r-ico{font-size:2rem}.role-card .r-title{font-weight:800;font-size:1.05rem;letter-spacing:.5px}.role-card .r-sub{color:var(--ink-faint);font-size:.85rem}
  .home .note{display:inline-block;margin-top:16px;font-family:var(--mono);font-size:.68rem;color:var(--ink-faint);border:1px dashed var(--line);border-radius:12px;padding:8px 16px;letter-spacing:.3px;max-width:560px;line-height:1.5}

  .interstitial{padding:28px 26px}.interstitial .eyebrow{margin-bottom:14px}

  /* =========================== Modo Auxiliar ============================ */
  .aux-wrap{max-width:460px;margin:0 auto}
  .aux-card{background:linear-gradient(180deg,var(--navy-800),var(--navy-700));border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:26px 22px}
  .aux-badge{font-family:var(--mono);font-size:.7rem;letter-spacing:3px;color:var(--cyan);text-transform:uppercase}
  .aux-card h2{font-size:1.5rem;margin:6px 0 2px;letter-spacing:1px}
  .aux-card .aux-sub{color:var(--ink-faint);font-size:.85rem;margin-bottom:18px}
  .aux-card label{display:block;font-size:.9rem;color:var(--ink-dim);margin-bottom:8px}
  .conv-table{width:100%;border-collapse:separate;border-spacing:0 10px}.conv-table td{padding:0}
  .conv-row{display:flex;align-items:center;gap:14px;background:var(--navy-700);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .conv-row .cletter{flex:0 0 46px;height:46px;display:grid;place-items:center;background:var(--graphite);color:var(--cyan);border-radius:10px;font-family:var(--mono);font-weight:800;font-size:1.3rem}
  .conv-row .carrow{color:var(--ink-faint);font-size:1.1rem}
  .conv-row .ccode{font-family:var(--mono);font-weight:800;font-size:1.35rem;letter-spacing:3px;color:var(--ink)}
  .aux-warn{margin-top:16px;padding:12px 14px;border-radius:10px;background:rgba(255,210,63,.07);border:1px solid rgba(255,210,63,.3);color:#ffe9a6;font-size:.9rem}
  .aux-wait{margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--navy-800);border:1px solid var(--line);color:var(--ink-faint);font-size:.82rem;font-family:var(--mono)}

  /* ============================= Perfil / gel =========================== */
  .profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 16px;align-items:start}
  .profile-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.9rem;background:var(--navy-800);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .profile-table caption{caption-side:top;text-align:left;padding:8px 10px;color:var(--ink-faint);font-family:var(--mono);font-size:.66rem;letter-spacing:1.5px;text-transform:uppercase}
  .profile-table th,.profile-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
  .profile-table th{color:var(--cyan);background:var(--navy-700);font-weight:700}
  .profile-table td:first-child,.profile-table th:first-child{text-align:left;color:var(--ink-dim)}
  .profile-table .allele{color:var(--ink);font-weight:700}
  .gel{background:var(--navy-800);border:1px solid var(--line);border-radius:10px;padding:8px}

function el(tag,props={},...kids){
  const n=document.createElement(tag);
  for(const[k,v] of Object.entries(props)){
    if(k==="class") n.className=v;
    else if(k==="html") n.innerHTML=v;
    else if(k.startsWith("aria")||["role","tabindex","type","placeholder","inputmode","autocomplete","href","target","rel","hidden","open"].includes(k)) n.setAttribute(k,v);
    else if(k.startsWith("on")&&typeof v==="function") n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v);
  }
  for(const kid of kids){ if(kid!=null) n.append(kid.nodeType?kid:document.createTextNode(kid)); }
  return n;
}

/* ---------------------------------------------------------------------------
   REVELAÇÃO PROGRESSIVA — mostra os blocos um a um.
   Avança por: clique no botão "Continuar", ou tecla Espaço/Enter/→/↓.
   Ao terminar, chama onDone() (que monta o próximo elemento da tela).
--------------------------------------------------------------------------- */
function sequencia(host, blocos, onDone){
  if(!blocos || !blocos.length){ onDone && onDone(); return; }
  const wrap=el("div",{class:"seq-blocos"}); host.append(wrap);
  const cue=el("div",{class:"seq-cue"},"▸ toque em Continuar ou pressione Espaço");
  const btn=el("button",{class:"btn btn-primary seq-next",type:"button"},"Continuar  ▸");
  let i=0;
  function mostrar(){
    if(i>=blocos.length) return;
    wrap.append(blocoEl(blocos[i])); i++;
    if(i>=blocos.length){ finalizar(); }
    else { host.append(cue, btn); }   // reposiciona o controle no fim
  }
  function finalizar(){ limpar(); onDone && onDone(); }
  function avancar(){ mostrar(); }
  function onKey(e){
    if(document.activeElement===btn) return;                 // evita duplo disparo
    if([" ","Enter","ArrowRight","ArrowDown"].includes(e.key)){ e.preventDefault(); avancar(); }
  }
  function limpar(){ cue.remove(); btn.remove(); document.removeEventListener("keydown",onKey); }
  btn.addEventListener("click",e=>{ e.stopPropagation(); btn.blur(); avancar(); });
  document.addEventListener("keydown",onKey);
  mostrar();                                                 // revela o primeiro bloco
}

function renderDecisao(container,passo){
  const local={errouAntes:false,resolvido:false};
  if(passo.miniatividade) container.append(el("p",{class:"eyebrow",style:"color:var(--ink-faint)"},"Miniatividade complementar"));
  container.append(el("p",{class:"prompt"},passo.pergunta));
  if(passo.preformatado) container.append(el("pre",{class:"seq"},passo.preformatado));
  if(passo.durante) renderBlocos(container, passo.durante);           // alerta AURORA durante o desafio

  const group=el("div",{class:"options",role:"group","aria-label":"Alternativas"});
  ["A","B","C","D"].forEach(L=>group.append(el("div",{class:"opt","data-letter":L},
    el("span",{class:"letter","aria-hidden":"true"},L), el("span",{class:"body"},passo.alternativas[L]))));
  container.append(group);

  // Código de etapa oculto em guia expansiva (inicia CONTRAÍDA).
  const det=el("details",{class:"etapa"});
  det.append(el("summary",{}, " Liberar código de etapa para a equipe auxiliar (clique ao autorizar)"));
  det.append(el("div",{class:"etapa-inner"},
    el("span",{class:"lbl"},"Equipe auxiliar: acesse a Central de Decisão com o código"),
    el("span",{class:"code"},passo.codigoEtapa.toUpperCase())));
  container.append(det);

  // Campo de decisão coletiva
  const dec=el("div",{class:"decision"}, el("div",{class:"d-label"},"Decisão da equipe"));
  const inp=el("input",{class:"code-input",type:"text",inputmode:"text",autocomplete:"off",placeholder:"Digite o código informado pela equipe auxiliar","aria-label":"Código da decisão coletiva"});
  const confirmBtn=el("button",{class:"btn btn-primary",type:"button"},"Confirmar decisão");
  dec.append(el("div",{class:"d-row"}, inp, confirmBtn)); container.append(dec);
  const resultZone=el("div",{"aria-live":"polite"}); container.append(resultZone);
  inp.focus();

  function confirmar(){
    if(local.resolvido) return;
    const code=normalizarCodigo(inp.value);
    if(!code){ erro("Digite o código informado pela equipe auxiliar."); return; }
    const letra=construirMapaInverso(passo.codigos)[code];
    if(!letra){ erro("Código não reconhecido. Confirme a decisão com a equipe auxiliar."); return; }
    inp.disabled=true; confirmBtn.disabled=true;
    processar(resultZone, ()=>revelar(letra));
  }
  function erro(msg){ resultZone.innerHTML="";
    resultZone.append(el("div",{class:"dialogo alerta",role:"note"}, el("span",{class:"rotulo"},"⚠ CÓDIGO INVÁLIDO"), el("p",{},msg))); inp.focus(); }

  function revelar(letra){
    const acertou=(letra===passo.correta);
    resultZone.innerHTML="";
    if(acertou){
      local.resolvido=true;
      // Evidencia MUITO a escolha (que coincide com a correta).
      group.querySelectorAll(".opt").forEach(o=>{ const L=o.dataset.letter;
        if(L===letra) o.classList.add("correct"); else o.classList.add("dim"); });
      resultZone.append(el("div",{class:"answer-reveal correct"},
        el("div",{class:"big"},"✓ Decisão da equipe: alternativa "+letra),
        el("div",{}, passo.alternativas[letra]),
        el("div",{style:"margin-top:6px"},"Alternativa CORRETA.")));
      let pts=0;
      if(passo.pontuacaoMaxima>0){
        const penalVideo=CONFIG.usarPontuacaoPorConsulta && estado.videosConsultados.has(estado.faseIndex);
        let f=1; if(penalVideo) f=Math.min(f,0.7); if(local.errouAntes) f=0.4;
        pts=Math.round(passo.pontuacaoMaxima*f);
        estado.score=Math.min(CONFIG.pontuacaoMaxima, estado.score+pts); atualizarHUD();
      }
      const ptsEl = passo.pontuacaoMaxima>0 ? el("div",{class:"pts"},"+"+pts+" pontos") : null;
      sequencia(resultZone, passo.okBlocos, ()=>{ if(ptsEl) resultZone.append(ptsEl); adicionarAvanco(resultZone); });
    }else{
      // ERRO: não revela a correta nem dá dica. Só avisa e reabre para nova escolha.
      local.errouAntes=true;
      group.querySelectorAll(".opt").forEach(o=>o.classList.remove("correct","wrong","dim"));
      resultZone.append(el("div",{class:"answer-reveal wrong"},
        el("div",{class:"big"},"⚠ Alternativa incorreta"),
        el("div",{},"A alternativa informada não está correta. Discutam novamente em equipe e escolham outra alternativa; depois informem o novo código.")));
      sequencia(resultZone, passo.wrongBlocos, ()=>{ inp.disabled=false; confirmBtn.disabled=false; inp.value=""; inp.focus(); });
    }
  }
  confirmBtn.addEventListener("click",confirmar);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") confirmar(); });
}

/* Animação de ~2s antes de revelar. */
function processar(zone, done){
  zone.innerHTML="";
  const msgs=["Validando decisão coletiva…","Conferindo evidências laboratoriais…","Processando perfil genético…"];
  zone.append(el("div",{class:"processing"}, el("div",{class:"proc-msg",id:"procMsg"},msgs[0]), el("div",{class:"scanner","aria-hidden":"true"})));
  let i=0; const iv=setInterval(()=>{ i=(i+1)%msgs.length; const m=$("#procMsg"); if(m) m.textContent=msgs[i]; },650);
  setTimeout(()=>{ clearInterval(iv); done(); },2000);
}

/* Avanço entre passos / fases / cenas. */
function adicionarAvanco(zone){
  const fase=FASES[estado.faseIndex];
  const ultimoPasso=estado.passoIndex>=fase.passos.length-1;
  const label=ultimoPasso?"Concluir fase  ▸":"Continuar  ▸";
  const btn=el("button",{class:"btn btn-primary",type:"button"},label);
  btn.addEventListener("click",()=>{
    if(ultimoPasso){ if(!estado.statuses.includes(fase.status)) estado.statuses.push(fase.status); atualizarHUD(); proximaCena(); }
    else { estado.passoIndex++; renderPassoInterno(); }
  });
  zone.append(el("div",{class:"actions"},btn)); btn.focus();
}

/* -------------------------- Passo ORDENAR (PCR) ------------------------- */
function renderOrdenar(container,passo){
  const local={ok:false};
  let order=[...passo.itens];
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  if(order.join("|")===passo.itens.join("|")) order.reverse();
  container.append(el("p",{class:"eyebrow",style:"color:var(--ink-faint)"},"Atividade coletiva (no projetor)"));
  container.append(el("p",{class:"prompt"},passo.pergunta));
  const list=el("ul",{class:"order-list",id:"orderList","aria-label":"Cartões para ordenar"}); container.append(list);
  const resultZone=el("div",{"aria-live":"polite"});
  container.append(el("div",{class:"actions"}, el("button",{class:"btn btn-primary",type:"button",id:"checkOrder"},"Verificar sequência")), resultZone);
  function paint(){ list.innerHTML="";
    order.forEach((name,i)=>{
      const up=el("button",{class:"mv",type:"button","aria-label":"Mover "+name+" para cima"},"▲");
      const dn=el("button",{class:"mv",type:"button","aria-label":"Mover "+name+" para baixo"},"▼");
      up.disabled=(i===0); dn.disabled=(i===order.length-1);
      up.addEventListener("click",()=>{[order[i-1],order[i]]=[order[i],order[i-1]];paint();});
      dn.addEventListener("click",()=>{[order[i+1],order[i]]=[order[i],order[i+1]];paint();});
      const li=el("li",{class:"order-item",draggable:"true","data-name":name},
        el("span",{class:"idx","aria-hidden":"true"},String(i+1)), el("span",{class:"name"},name), el("span",{class:"moves"},up,dn));
      li.addEventListener("dragstart",()=>li.classList.add("dragging"));
      li.addEventListener("dragend",()=>{li.classList.remove("dragging");order=[...list.querySelectorAll(".order-item")].map(n=>n.dataset.name);paint();});
      list.append(li);
    });
  }
  list.addEventListener("dragover",e=>{ e.preventDefault(); const d=list.querySelector(".dragging"); if(!d)return;
    const after=[...list.querySelectorAll(".order-item:not(.dragging)")].find(it=>{const bx=it.getBoundingClientRect();return e.clientY<=bx.top+bx.height/2;});
    if(after) list.insertBefore(d,after); else list.append(d); });
  paint();
  $("#checkOrder",container).addEventListener("click",()=>{
    if(local.ok) return;
    const ok=order.join("|")===passo.itens.join("|"); resultZone.innerHTML="";
    if(ok){ local.ok=true; list.classList.add("correct");
      list.querySelectorAll(".mv").forEach(x=>x.disabled=true); list.querySelectorAll(".order-item").forEach(li=>li.setAttribute("draggable","false"));
      $("#checkOrder",container).disabled=true;
      sequencia(resultZone, passo.okBlocos, ()=>adicionarAvanco(resultZone));
    }else{
      resultZone.append(el("div",{class:"answer-reveal wrong"},
        el("div",{class:"big"},"⚠ Sequência incorreta"),
        el("div",{},"Reorganizem os cartões em equipe e verifiquem novamente.")));
      if(passo.wrongBlocos) sequencia(resultZone, passo.wrongBlocos, ()=>{});
    }
  });
}

/* ============================================================================
   14) PERFIL STR — tabela + gel (SVG inline)
   ============================================================================ */
const PROFILE={ alleles:[20,18,16,15,14,12],
  people:[{key:"M",name:"Maria",a:[12,14]},{key:"F",name:"Lucas",a:[14,18]},{key:"P1",name:"João",a:[15,18]},{key:"P2",name:"Carlos",a:[12,16]}],
  highlight:18 };
function buildProfile(){
  const wrap=el("div",{class:"profile-grid"});
  const table=el("table",{class:"profile-table"}); table.append(el("caption",{},"Resultado do exame — marcador STR"));
  const thead=el("thead"),htr=el("tr"); htr.append(el("th",{},"Pessoa"),el("th",{},"Alelos")); thead.append(htr); table.append(thead);
  const tb=el("tbody"); PROFILE.people.forEach(p=>tb.append(el("tr",{},el("td",{},"["+p.key+"] "+p.name),el("td",{class:"allele"},p.a[0]+" / "+p.a[1])))); table.append(tb);
  const gel=el("div",{class:"gel"}, el("div",{class:"gel-cap"},"Gel de eletroforese (bandas simplificadas)"), buildGelSVG());
  wrap.append(table,gel); return wrap;
}
function buildGelSVG(){
  const NS="http://www.w3.org/2000/svg", people=PROFILE.people, alleles=PROFILE.alleles;
  const padL=44,padT=26,colW=58,rowH=30,padB=26, w=padL+colW*people.length+14, h=padT+rowH*alleles.length+padB;
  const svg=document.createElementNS(NS,"svg"); svg.setAttribute("viewBox","0 0 "+w+" "+h); svg.setAttribute("role","img");
  svg.setAttribute("aria-label","Gel de eletroforese com as bandas dos marcadores STR de Maria, Lucas, João e Carlos, todas na mesma cor. Maria 12 e 14; Lucas 14 e 18; João 15 e 18; Carlos 12 e 16. Compare as posições para interpretar a herança dos alelos.");
  const mk=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};
  svg.appendChild(mk("rect",{x:padL-6,y:padT-6,width:colW*people.length+6,height:rowH*alleles.length+8,rx:8,fill:"#0b1830",stroke:"rgba(120,160,210,.18)"}));
  const maxA=Math.max(...alleles),minA=Math.min(...alleles);
  alleles.forEach((al,r)=>{ const y=padT+r*rowH+rowH/2;
    svg.appendChild(mk("line",{x1:padL-2,y1:y,x2:padL+colW*people.length-6,y2:y,stroke:"rgba(120,160,210,.10)"}));
    const t=mk("text",{x:padL-10,y:y+4,"text-anchor":"end",fill:"#7a90b2","font-size":"11","font-family":"ui-monospace,monospace"});
    t.textContent= al===maxA? al+" (maior)" : al===minA? al+" (menor)" : String(al); svg.appendChild(t); });
  people.forEach((p,c)=>{ const x=padL+c*colW+colW/2;
    const t=mk("text",{x:x,y:padT-10,"text-anchor":"middle",fill:"#38d6ff","font-size":"11","font-weight":"700","font-family":"ui-monospace,monospace"});
    t.textContent="["+p.key+"]"; svg.appendChild(t); });
  let delay=0;
  people.forEach((p,c)=>{ const x=padL+c*colW+8;
    p.a.forEach(al=>{ const r=alleles.indexOf(al); if(r<0)return; const y=padT+r*rowH+rowH/2;
      /* Todas as bandas na MESMA cor — nenhum alelo é destacado, para não entregar a
         resposta e forçar os alunos a comparar as posições e interpretar a herança. */
      const band=mk("rect",{x:x,y:y-4,width:colW-16,height:8,rx:3,fill:"#d7e6fb",class:"band"});
      band.style.animationDelay=(delay+=70)+"ms"; svg.appendChild(band); }); });
  const pol=mk("text",{x:padL+colW*people.length/2,y:h-8,"text-anchor":"middle",fill:"#7a90b2","font-size":"10","font-family":"ui-monospace,monospace"});
  pol.textContent="▼ migração → polo (+) · fragmentos menores migram mais"; svg.appendChild(pol);
  return svg;
}

/* ============================================================================
   15) TELA FINAL — parecer (sem botão de dossiê)
   ============================================================================ */
function renderFinal(){
  atualizarHUD();
  $("#phaseLabel").textContent="Dia 5 · Investigação concluída"; $("#phaseName").textContent="Parecer emitido";
  $("#progressFill").style.width="100%"; $("#progressBar").setAttribute("aria-valuenow",5);
  const rank=RANKS.find(r=>estado.score>=r.min)||RANKS[RANKS.length-1];
  stage.innerHTML="";
  const panel=el("section",{class:"panel verdict"},
    el("p",{class:"eyebrow"},"Caso 0147 · Encerrado"), el("h2",{class:"title"},"Investigação concluída"));
  const nar=el("div",{style:"text-align:left"}); panel.append(nar);
  stage.append(panel);
  sequencia(nar, [
    b("narrador","A equipe concluiu a investigação com rastreabilidade, método e interpretação proporcional às evidências disponíveis.","◇ NARRADOR · DIA 5 — GABINETE DE EMISSÃO DO PARECER"),
    b("principal","O parecer registra a compatibilidade observada e os limites necessários para interpretá-la com responsabilidade.")
  ], ()=>{
    panel.append(el("div",{class:"rank-badge"},
      el("span",{class:"rank-icon","aria-hidden":"true"},rank.icon),
      el("span",{class:"rank-name"},rank.name),
      el("span",{class:"rank-score"},estado.score+" / "+CONFIG.pontuacaoMaxima+" pontos")));
    panel.append(el("p",{class:"rank-msg"},rank.msg));
    panel.append(el("div",{class:"report"}, el("h4",{},"Parecer pericial"),
      el("p",{},"A análise conjunta do painel de STRs foi compatível com a hipótese de paternidade de João e incompatível com a hipótese de paternidade de Carlos, dentro dos parâmetros técnicos e estatísticos do laboratório.")));
    panel.append(el("div",{class:"sci-note"}, el("b",{},"Importante: "),
      "este é um cenário didático simplificado. Em exames reais de vínculo biológico, a conclusão não deve ser baseada em apenas um marcador. Laboratórios analisam múltiplos loci STR, adotam controles de qualidade, mantêm a cadeia de custódia e realizam avaliação estatística da evidência."));
    const fech=el("div",{class:"closing"}); panel.append(fech);
    sequencia(fech, [
      b("sistema","AURORA | CASO 0147 ENCERRADO PARA FINS EDUCACIONAIS")
    ], ()=>{
      panel.append(el("div",{class:"actions",style:"justify-content:center;margin-top:20px"},
        el("button",{class:"btn btn-primary",type:"button",onclick:iniciarPrincipal},"↺ Reiniciar investigação")));
    });
  });
  voltarAoTopo();
}

const videoOverlay=$("#videoOverlay"); let lastFocused=null;
function abrirVideo(refKey,faseIdx){
  const v=VIDEOS[refKey]; if(!v) return;
  if(faseIdx!=null) estado.videosConsultados.add(faseIdx);
  lastFocused=document.activeElement;
  $("#videoTitle").textContent="🎬 Arquivo audiovisual: "+v.titulo;
  const body=$("#videoBody"); body.innerHTML="";
  body.append(
    el("p",{style:"color:var(--ink-dim)"},v.contexto),
    el("div",{class:"video-guide"},
      el("div",{style:"font-family:var(--mono);font-size:.66rem;letter-spacing:1px;color:var(--ink-faint);text-transform:uppercase"},"Pergunta-guia"),
      el("div",{class:"g-q"},v.perguntaGuia)),
    el("div",{class:"actions"},
      el("a",{class:"btn btn-primary",href:v.url,target:"_blank",rel:"noopener"},"Abrir vídeo em nova aba"),
      el("button",{class:"btn btn-ghost",type:"button",onclick:closeVideo},"Voltar à investigação")));
  if(CONFIG.usarPontuacaoPorConsulta) body.append(el("div",{class:"aux-warn",style:"margin-top:12px"},"Consultar este arquivo reduz a bonificação máxima desta fase."));
  videoOverlay.classList.add("open"); $("#closeVideo").focus(); document.addEventListener("keydown",escVideo);
}
function closeVideo(){ videoOverlay.classList.remove("open"); document.removeEventListener("keydown",escVideo); lastFocused&&lastFocused.focus(); }
function escVideo(e){ if(e.key==="Escape") closeVideo(); }
$("#closeVideo").addEventListener("click",closeVideo);
videoOverlay.addEventListener("click",e=>{ if(e.target===videoOverlay) closeVideo(); });
