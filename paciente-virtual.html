<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paciente virtual · O primeiro atendimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#2b2433; --papel:#fbf6ec; --papel2:#f1e8d6; --borda:#d8ccb4;
  --acento:#b04a5a; --acento2:#2f6f8f; --ok:#3e8e5e; --aviso:#e0982e;
  --tape:#1d1a22;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#15131a;color:var(--tinta);font-family:"Nunito",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
body{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea{user-select:text;-webkit-user-select:text}
.oculto{display:none!important}

/* ---------- portão ---------- */
#portao{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#15131a;z-index:50}
#portao button{font-family:system-ui,sans-serif;font-size:22px;padding:18px 34px;border-radius:14px;border:0;background:#f4ead6;color:#2b2433;font-weight:700;box-shadow:0 6px 0 #b9a98a}

/* ---------- telas de papel (entrada, senha, sala de espera) ---------- */
.tela-papel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px 18px 52px;overflow:auto;
  background:radial-gradient(ellipse at 30% 20%,#2c2836,#15131a 70%)}
.papel{background:var(--papel);border-radius:18px;padding:28px 26px;width:min(560px,100%);box-shadow:0 18px 40px rgba(0,0,0,.45);border:2px solid var(--borda)}
.papel h1{font-family:"Press Start 2P",monospace;font-size:17px;line-height:1.6;margin:0 0 6px;color:var(--acento)}
.papel h2{font-size:20px;margin:0 0 14px}
.papel p{margin:6px 0 14px;line-height:1.45}
.papel .sub{color:#6b5f73;font-size:15px}
.btn{display:block;width:100%;padding:14px 16px;margin:10px 0;border-radius:12px;border:2px solid #cdbf9f;background:#fff;font-weight:800;font-size:17px;text-align:left;color:var(--tinta)}
.btn small{display:block;font-weight:600;color:#6b5f73;font-size:14px;margin-top:2px}
.btn.forte{background:var(--acento);border-color:#8d3343;color:#fff}
.btn.forte small{color:#f6dfe3}
.btn.azul{background:var(--acento2);border-color:#22556e;color:#fff;text-align:center}
.btn:disabled{opacity:.45;cursor:default}
.campo{display:block;margin:10px 0}
.campo span{display:block;font-weight:800;font-size:14px;margin-bottom:4px}
.campo input{width:100%;padding:12px;border-radius:10px;border:2px solid #cdbf9f;font:inherit;font-size:18px;background:#fff}
.campo input.codigo{text-transform:uppercase;letter-spacing:6px;font-weight:900;text-align:center;font-size:26px}
.msg{min-height:22px;color:var(--acento);font-weight:700;font-size:15px}
.linha-btns{display:flex;gap:10px}
.linha-btns .btn{text-align:center}
.lista-eq{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
.grupo-eq{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.grupo-eq .aluno{display:inline-flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--borda);border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px}
.grupo-eq .aluno.off{opacity:.45}
.grupo-eq .aluno .x{background:#ddd;border:0;border-radius:50%;width:20px;height:20px;line-height:18px;padding:0;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:800;font-size:15px;color:#fff}
.chip .x{background:rgba(0,0,0,.25);border:0;color:#fff;border-radius:50%;width:22px;height:22px;line-height:20px;padding:0;font-size:14px}
.chip.off{opacity:.45}
.cod-grande{font-family:"Press Start 2P",monospace;font-size:44px;letter-spacing:8px;color:var(--acento2);text-align:center;margin:8px 0}

/* ---------- projetor ---------- */
#proj{position:fixed;inset:0;display:flex;flex-direction:column;background:#0d0c10}
#palcoBox{flex:1;position:relative;overflow:hidden}
#palco{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:#000}
#cena,#cenaFrente{position:absolute;inset:0;width:1600px;height:900px;image-rendering:pixelated;image-rendering:crisp-edges}
#cena{z-index:1}
#cenaFrente{z-index:3;pointer-events:none}
#rx{position:absolute;left:1216.7px;top:116.7px;width:200px;height:200px;z-index:2;pointer-events:none;overflow:hidden;box-shadow:0 0 0 2px #0b0d10}
#rx img{width:100%;height:100%;display:block;filter:contrast(1.08) brightness(.96)}
#rx .etq{position:absolute;right:6px;bottom:6px;background:#f1efe6;color:#1d1f24;font-family:"Press Start 2P",monospace;font-size:7px;padding:4px 5px;border-radius:2px}
#rx::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(230,245,255,.10),rgba(0,0,0,.18))}
#hud{position:absolute;left:0;right:0;top:0;height:74px;display:flex;align-items:center;gap:14px;padding:0 20px;
  background:linear-gradient(#000c,#0000);color:#fff;z-index:5}
#hud .cod{font-family:"Press Start 2P",monospace;font-size:15px;background:#0008;padding:10px 12px;border-radius:10px}
#hud .vez{font-size:24px;font-weight:900;text-shadow:0 2px 4px #000;display:flex;align-items:center;gap:10px}
#hud .vez .chip{font-size:22px;padding:6px 16px}
#hud .esp{flex:1}
#hud .hb{background:#000a;border:2px solid #fff4;color:#fff;border-radius:10px;padding:8px 12px;font-weight:800;font-size:16px}
#hud .hb:hover{background:#000d}
#equipesBar{position:absolute;left:20px;top:78px;display:flex;flex-wrap:wrap;gap:6px;max-width:900px;z-index:5}
#equipesBar .chip{font-size:14px;padding:4px 10px;border:2px solid transparent}
#equipesBar .chip.vez{border-color:#fff;box-shadow:0 0 0 3px #0006}
#equipesBar .chip .feitas{background:#0003;border-radius:8px;padding:0 6px}

.balao{position:absolute;z-index:6;max-width:560px;background:rgba(255,253,247,.72);backdrop-filter:blur(2px);border:4px solid #2b2433;border-radius:22px;padding:16px 22px 18px;
  font-size:27px;line-height:1.32;font-weight:700;color:#2b2433;box-shadow:0 8px 0 #0005;opacity:0;transform:translateY(10px) scale(.97);transition:opacity .25s,transform .25s}
.balao.on{opacity:1;transform:none}
.balao:not(.on){pointer-events:none}
.balao .txt{opacity:0;transition:opacity 1.3s ease}
.balao.vis .txt{opacity:1}
.balao.ja .txt{transition:none}
.balao .quem{display:block;font-size:17px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.balao::after{content:"";position:absolute;width:26px;height:26px;background:rgba(255,253,247,.72);border:4px solid #2b2433;border-top:0;border-left:0;bottom:-17px;transform:rotate(45deg)}
#balaoP{right:1090px;top:110px;max-width:470px}
#balaoP .quem{color:#7a4f9a}
#balaoP::after{right:40px}
#balaoA{left:1165px;top:410px;max-width:410px}
#balaoA .quem{color:#2f5f9e}
#balaoA::after{left:-17px;bottom:auto;top:40px;transform:rotate(135deg)}
#balaoN{left:50%;top:auto;bottom:230px;transform:translateX(-50%);background:#2b2433e6;color:#f4ead6;border-color:#f4ead6;font-style:italic;font-weight:600;font-size:24px;max-width:900px;text-align:center}
#balaoN.on{transform:translateX(-50%)}
#balaoN::after{display:none}
#balaoQ{left:50%;bottom:24px;background:rgba(255,255,255,.85);transform:translateX(-50%) translateY(10px);max-width:1100px;width:max-content;min-width:520px;text-align:center;font-size:30px;background:#fff;border-width:5px}
#balaoQ.on{transform:translateX(-50%)}
#balaoQ::after{display:none}
#balaoQ .quem{font-size:18px}
.balao .seguir{display:none;margin-top:10px;font-size:15px;color:#8a7f92;font-weight:800;font-style:normal;letter-spacing:.3px}
.balao.pronto .seguir{display:block;animation:pisca 1.4s ease-in-out infinite}
#balaoN .seguir{color:#d9cfe6}
#balaoP,#balaoA,#balaoN{cursor:pointer}
@keyframes pisca{50%{opacity:.35}}
#balaoQ .dica{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;font-size:17px;color:#6b5f73;font-weight:700}
#balaoQ .bt-ouvir{font:inherit;font-size:24px;font-weight:900;color:#fff;background:#3e8e5e;border:0;border-radius:14px;padding:10px 22px;box-shadow:0 5px 0 #2a6542;cursor:pointer}
#balaoQ .bt-ouvir:active{transform:translateY(3px);box-shadow:0 2px 0 #2a6542}
#balaoQ .atalho{font-size:15px;color:#8a7f92}
#abertura{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 20%,#2c2836,#15131a 70%);transition:opacity .8s}
#abertura .cartao{background:var(--papel);border-radius:22px;padding:44px 60px;max-width:1000px;border:4px solid var(--borda);box-shadow:0 18px 40px rgba(0,0,0,.45)}
#abertura .eyebrow{display:block;text-align:center;font-family:"Press Start 2P",monospace;font-size:16px;color:var(--acento);line-height:1.7}
#abertura h1{font-size:46px;margin:14px 0 18px;text-align:center}
#abertura p{font-size:26px;line-height:1.5;margin:12px 0;text-align:justify;hyphens:auto}
#abertura .cod-sala{text-align:center;font-size:22px;margin:16px 0 0}
#abertura #btEntrarSala{text-align:center;font-size:24px;margin-top:24px}
#abertura .cod-grande{font-size:64px}
#painelEnsaio{position:absolute;right:16px;bottom:16px;width:400px;max-height:470px;z-index:9;border-radius:22px;overflow:hidden;
  box-shadow:0 10px 30px #000a;border:6px solid #222;background:var(--papel);display:flex;flex-direction:column}
#painelEnsaio .topo{background:#222;color:#fff;font-weight:800;font-size:14px;padding:6px 12px;display:flex;justify-content:space-between;align-items:center}
#painelEnsaio .topo button{background:#444;border:0;color:#fff;border-radius:6px;padding:2px 8px}
#painelEnsaio .corpo{overflow:auto;flex:1}
#painelEnsaio.min .corpo{display:none}
#modal{position:absolute;inset:0;z-index:20;background:#000b;display:flex;align-items:center;justify-content:center}
#modal .papel{width:620px}
#modal .papel h2{font-size:28px}
#modal .papel p{font-size:20px}
/* rodapé padrão (igual ao do Uninogwarts) */
.site-footer{flex:none;padding:7px 14px;border-top:1px solid rgba(255,255,255,.15);background:#0d0806;color:rgba(255,255,255,.55);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:12.5px;letter-spacing:.02em;text-align:left;line-height:1.5}
.site-footer strong{color:rgba(255,255,255,.8)}
.site-footer-linha{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 14px}
.site-footer-verso{margin-left:auto;color:rgba(255,255,255,.45)}
#telaPapel .site-footer{position:fixed;left:0;right:0;bottom:0}
@media (max-width:600px){.site-footer{font-size:11px;padding:5px 10px}.site-footer-verso{margin-left:0}}
@media (pointer:coarse) and (orientation:landscape){.site-footer{display:none}}

/* ---------- aparelho da equipe ---------- */
#fone{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--papel2)}
.f-topo{padding:12px 14px 10px;color:#fff;font-weight:800;display:flex;align-items:center;gap:10px}
.f-topo .nome{font-size:18px;flex:1}
.f-topo .sair{background:#0003;border:0;color:#fff;border-radius:8px;padding:6px 10px;font-weight:800;font-size:13px}
.f-vez{padding:10px 14px;font-weight:800;font-size:16px;background:#fff;border-bottom:2px solid var(--borda)}
.f-vez.minha{background:#fff6d8;color:#7a5300}
.f-corpo{flex:1;overflow:auto;padding:12px 14px 18px}
:root{--perg:#ef6c1a;--perg2:#fff1e5;--perg3:#b44a08;--conv:#0f8f8a;--conv2:#e3f6f4;--conv3:#0a625e}
.f-abas{display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:2px solid var(--borda)}
.f-abas button{flex:1;border:3px solid transparent;border-radius:14px;padding:12px 4px;font-weight:900;font-size:16px;color:#fff;opacity:.55;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.f-abas button.on{opacity:1;border-color:#fff;outline:3px solid}
.f-abas .ab-perg{background:var(--perg);outline-color:var(--perg)}
.f-abas .ab-conv{background:var(--conv);outline-color:var(--conv)}
.f-abas .n{display:inline-block;background:#fff;color:var(--conv3);border-radius:999px;padding:0 8px;margin-left:4px;font-size:14px}
.tema-perg{background:var(--perg2)}
.tema-perg .cat{border-color:#f6b98c}
.tema-perg .cat .n{color:var(--perg3)}
.tema-perg .perg{border-color:#f6b98c}
.tema-perg .perg.sel{border-color:var(--perg);box-shadow:0 0 0 3px #ef6c1a44}
.tema-perg .f-titulo button{background:var(--perg);color:#fff}
.tema-perg .grande{background:var(--perg);box-shadow:0 4px 0 var(--perg3)}
.tema-perg .grande.verde{background:var(--ok);box-shadow:0 4px 0 #2a6542}
.tema-perg .confirma{background:var(--perg2)}
.tema-perg .aviso.vez{border-color:var(--perg);background:#fff}
.tema-conv{background:var(--conv2)}
.tema-conv .hist-item{box-shadow:0 2px 0 #0f8f8a33}
.tema-conv .hist-item .q small{color:var(--conv3)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:2px solid var(--borda);background:#fff;border-radius:14px;padding:14px 10px;text-align:center;font-weight:800;font-size:15px;color:var(--tinta)}
.cat .ic{display:block;font-size:30px;margin-bottom:4px}
.cat.trava,.tema-perg .cat.trava{filter:grayscale(1);opacity:.5;background:#eee;border-color:#bbb;cursor:not-allowed}
.cat.trava .n{color:#777}
.cat .n{display:block;font-weight:700;color:#7d7186;font-size:12px;margin-top:3px}
.f-titulo{font-weight:900;font-size:17px;margin:2px 0 10px;display:flex;align-items:center;gap:8px}
.f-titulo button{border:0;background:var(--papel);border-radius:8px;padding:6px 10px;font-weight:800;color:var(--tinta)}
.perg{display:block;width:100%;text-align:left;border:2px solid var(--borda);background:#fff;border-radius:12px;padding:12px;margin:0 0 9px;font-weight:700;font-size:16px;line-height:1.35;color:var(--tinta)}
.perg.feita{opacity:.5;text-decoration:line-through}
.perg.sel{border-color:var(--acento2);box-shadow:0 0 0 3px #2f6f8f33}
.perg .tag{display:inline-block;font-size:11px;font-weight:900;background:var(--papel2);border-radius:6px;padding:1px 6px;margin-left:6px;text-decoration:none}
.aviso{background:#fff;border:2px dashed var(--borda);border-radius:12px;padding:12px;font-weight:700;color:#6b5f73;margin:0 0 12px;line-height:1.4}
.aviso.vez{border:2px solid var(--aviso);background:#fff6d8;color:#6b4a00}
.confirma{position:sticky;bottom:-18px;background:var(--papel2);padding:10px 0 6px}
.grande{display:block;width:100%;padding:16px;border-radius:14px;border:0;font-weight:900;font-size:18px;color:#fff;background:var(--acento2);box-shadow:0 4px 0 #1f4c62}
.grande.verde{background:var(--ok);box-shadow:0 4px 0 #2a6542}
.grande:disabled{opacity:.5}
.hist-item{background:#fff;border-radius:12px;padding:10px 12px;margin:0 0 10px;border-left:6px solid #999}
.hist-item .q{font-weight:800;font-size:15px;margin-bottom:6px}
.hist-item .q small{display:block;font-size:12px;font-weight:800;opacity:.75}
.hist-item .r{font-size:15px;line-height:1.4;margin:3px 0}
.hist-item .r b{font-weight:900}
.hist-item .r.n{font-style:italic;color:#6b5f73}
.voz-alta{background:#fff;border:3px solid var(--perg);border-radius:16px;padding:18px 16px;text-align:center;font-weight:800;font-size:17px;line-height:1.4;color:var(--tinta)}
.voz-alta .ic{display:block;font-size:44px;margin-bottom:6px}
.voz-alta b{display:block;margin:12px 0 8px;font-size:22px;line-height:1.35;color:var(--perg3)}
.voz-alta small{display:block;font-size:14px;color:#6b5f73;font-weight:700}
.voz-alta.espera{border-style:dashed;border-color:#bbb}
.cats.mini{grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.cats.mini .cat{padding:5px 2px;font-size:10.5px;border-radius:9px;line-height:1.15}
.cats.mini .cat .ic{font-size:17px;margin-bottom:1px}
.cats.mini .cat .n{display:none}
.perg.trava{filter:grayscale(1);opacity:.5;background:#eee;cursor:not-allowed}
.prog-voto{font-weight:800;font-size:14px;color:var(--perg3);margin:-4px 0 10px}
.cat{position:relative}
.cat.voto,.tema-perg .cat.voto{border-color:var(--perg);box-shadow:0 0 0 3px #ef6c1a55;background:#fff7f0}
.nv{display:inline-block;margin-left:6px;background:var(--perg);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:900;text-decoration:none}
.cat .nv{position:absolute;top:6px;right:6px;margin:0}
.aviso.espera-prof{font-size:18px;text-align:center;padding:26px 14px}
.f-topo small{font-weight:700;opacity:.85}
#balaoQ .bt-fechar{font:inherit;font-size:16px;font-weight:800;color:#5a4f62;background:#efe9df;border:2px solid #cfc4b1;border-radius:10px;padding:6px 12px;cursor:pointer}
.vazio{color:#7d7186;font-weight:700;text-align:center;padding:30px 10px}
</style>
</head>
<body>

<div id="portao"><button id="btPortao">▶ Clique para começar</button></div>

<!-- entrada / senha / sala de espera / aparelho -->
<div id="telaPapel" class="tela-papel oculto"></div>

<!-- projetor -->
<div id="proj" class="oculto">
  <div id="palcoBox">
    <div id="palco">
      <canvas id="cena" width="480" height="270"></canvas>
      <div id="rx"><img id="rxImg" alt="Radiografia de tórax no negatoscópio"><span class="etq">J. FERREIRA</span></div>
      <canvas id="cenaFrente" width="480" height="270"></canvas>
      <div id="hud"></div>
      <div id="equipesBar"></div>
      <div id="balaoN" class="balao"></div>
      <div id="balaoP" class="balao"></div>
      <div id="balaoA" class="balao"></div>
      <div id="balaoQ" class="balao"></div>
      <div id="abertura" class="oculto"></div>
      <div id="painelEnsaio" class="oculto"><div class="topo"><span>📱 Celular simulado (equipe da vez)</span><button id="btMinEnsaio">–</button></div><div class="corpo" id="ensaioCorpo"></div></div>
      <div id="modal" class="oculto"></div>
    </div>
  </div>
  <footer class="site-footer">
    <div class="site-footer-linha">
      <span>Desenvolvido por <strong>Prof. Dr. Aldair de França Neto</strong></span>
      <span class="site-footer-verso">Versão 0.19 &middot; Última atualização: 26 de novembro de 2026</span>
    </div>
  </footer>
</div>

<!-- aparelho da equipe -->
<div id="fone" class="oculto"></div>

<script>

    EST.votos[j.seat] = q.id;
    if (EST.membros[timeDaVez()].every((s) => EST.votos[s])) resolverVotacao();
  } else if (j.tipo === "fechar" && prof) {         /* o professor encerra a votação (alguém da equipe não votou) */
    if (!EST.aberta || EST.falando || EST.pend || conversaTerminou() || !Object.keys(EST.votos).length) return;
    resolverVotacao();
  } else if (j.tipo === "ouvir" && prof) {          /* só o professor, no projetor */
    if (!EST.pend || EST.falando) return;
    const item = { t: EST.pend.t, q: EST.pend.q };
    EST.feitas[item.q] = item.t;
    EST.hist.push(item);
    EST.pend = null; EST.cat = null; EST.votos = {}; EST.decisao = null;
    EST.vez++;
    EST.falando = true;
    if (aoVivo) aoOuvir(item);
  } else if (j.tipo === "fimResp" && prof) {
    EST.falando = false;
  }
  atualizarTudo();
}

/* ---------------- porta única das jogadas ---------------- */
const TIPOS_PROF = ["abrir", "fechar", "ouvir", "fimResp"];
function acao(tipo, dados) {
  if (APP.ensaio) {
    const seat = TIPOS_PROF.includes(tipo) ? -1 : EST.membros[timeDaVez()][0];
    aplicar({ seq: ONL.prox++, seat, tipo, dados }, true);
    return;
  }
  if (!ONL.sock || !ONL.sock.connected) { if (tipo === "fimResp") ONL.fimPendente = true; avisoFone("Sem conexão. Tentando reconectar…"); return; }
  ONL.sock.emit("acao", { tipo, dados }, (r) => { if (!r || !r.ok) avisoFone((r && r.erro) || "Não consegui enviar."); });
}

/* =====================================================================
   ONLINE (mesmo servidor de salas dos outros jogos)
   ===================================================================== */
const ONL_URL = "https://jogos-multiplayer-server.onrender.com";
const ONL_LIB = "https://cdn.socket.io/4.8.1/socket.io.min.js";
const ONL_JOGO = "paciente";              /* até 60 celulares (server.js v2.2) */
const ONL_JOGO_ANTIGO = "investigacao";   /* servidor ainda não atualizado: até 12 celulares */
const ONL_CHAVE = "paciente-virtual-online";
const ONL_SENHA = "aldair";
const ONL = { sock: null, papel: null, codigo: null, token: null, nome: null, seat: null, sala: null, ativo: false, prox: 0, sinc: false };
const APP = { tela: "entrada", msg: "", ensaio: false, fim: false };

function onlGuardar() { try { localStorage.setItem(ONL_CHAVE, JSON.stringify({ papel: ONL.papel, codigo: ONL.codigo, token: ONL.token, nome: ONL.nome })); } catch (e) {} }
function onlLerGuardado() { try { return JSON.parse(localStorage.getItem(ONL_CHAVE)); } catch (e) { return null; } }
function onlEsquecer() { try { localStorage.removeItem(ONL_CHAVE); } catch (e) {} }
function profLiberado() { try { return sessionStorage.getItem("onlProfLiberado") === "1"; } catch (e) { return false; } }
function msg(t) { APP.msg = t || ""; const m = document.querySelector(".msg"); if (m) m.textContent = APP.msg; }

function onlConectar(cb) {
  function pronto() {
    if (ONL.sock) { cb(); return; }
    const sk = ONL.sock = window.io(ONL_URL, { reconnectionDelayMax: 4000 });
    sk.on("connect", () => { msg(""); if (ONL.codigo) onlRetomar(); atualizarTudo(); });
    sk.on("disconnect", () => atualizarTudo());
    sk.on("connect_error", () => msg("Conectando ao servidor… se ele estava dormindo, pode levar até 1 minuto."));
    sk.on("sala", (v) => { ONL.sala = v; if (!ONL.ativo) desenharPapel(); else atualizarTudo(); });
    sk.on("seu-lugar", (d) => { ONL.seat = d.seat; });
    sk.on("inicio", (p) => onlComecar(p));
    sk.on("acao", onlReceber);
    sk.on("lobby", () => { ONL.ativo = false; APP.tela = "lobby"; mostrar(); });
    sk.on("removido", () => onlSair("O professor removeu a sua equipe da sala."));
    sk.on("substituido", () => onlSair("Esta equipe entrou na sala por outro aparelho."));
    sk.on("sala-fechada", () => {
      onlEsquecer();
      if (ONL.papel === "equipe") { APP.fim = true; ONL.codigo = null; atualizarTudo(); return; }
      onlSair("A sala foi encerrada.");
    });
    cb();
  }
  if (window.io) { pronto(); return; }
  msg("Carregando…");
  const sc = document.createElement("script");
  sc.src = ONL_LIB; sc.onload = pronto;
  sc.onerror = () => msg("Sem internet? Não consegui carregar a conexão online.");
  document.head.appendChild(sc);
}
function onlCriarSala() {
  APP.tela = "conectando"; mostrar();
  onlConectar(() => {
    const criar = (jogo, max) => ONL.sock.emit("prof:criar", { jogo, max, config: { atividade: "paciente-virtual" } }, (r) => {
      if (r && !r.ok && r.erro === "Jogo desconhecido." && jogo !== ONL_JOGO_ANTIGO) { criar(ONL_JOGO_ANTIGO, 12); return; }
      if (!r || !r.ok) { APP.tela = "entrada"; mostrar(); msg((r && r.erro) || "Não consegui criar a sala."); return; }
      ONL.maxAparelhos = r.sala.max;
      Object.assign(ONL, { papel: "prof", codigo: r.codigo, token: r.token, nome: null, seat: null, sala: r.sala });
      onlGuardar();
      APP.tela = "lobby"; mostrar();
    });
    criar(ONL_JOGO, 60);
  });
}
function onlEntrar() {
  const codigo = ($("inCodigo").value || "").trim().toUpperCase();
  const time = ($("inTime").value || "").replace(/\|/g, " ").trim(), aluno = ($("inNome").value || "").replace(/\|/g, " ").trim();
  if (codigo.length !== 4) { msg("O código da sala tem 4 caracteres."); return; }
  if (!time) { msg("Digite o nome da equipe."); return; }
  if (!aluno) { msg("Digite o seu nome."); return; }
  const doTime = ((ONL.sala && ONL.sala.codigo === codigo && ONL.sala.equipes) || []).filter((e) => partesNome(e.nome)[0].toLowerCase() === time.toLowerCase());
  if (doTime.length >= MAX_POR_EQUIPE) { msg(`A equipe ${time} já tem ${MAX_POR_EQUIPE} pessoas.`); return; }
  const nome = time + "|" + aluno;
  onlConectar(() => {
    ONL.sock.emit("aluno:entrar", { codigo, nome }, (r) => {
      if (!r || !r.ok) { msg(r && /Já existe/.test(r.erro || "") ? "Já existe alguém com esse nome nessa equipe." : (r && r.erro) || "Não consegui entrar."); return; }
      const mesmos = r.sala.equipes.filter((e) => partesNome(e.nome)[0].toLowerCase() === time.toLowerCase());
      if (!r.partida && mesmos.length > MAX_POR_EQUIPE) { APP.tela = "equipe"; onlSair(`A equipe ${time} já tem ${MAX_POR_EQUIPE} pessoas. Escolha outra equipe.`); APP.tela = "equipe"; mostrar(); msg(`A equipe ${time} já tem ${MAX_POR_EQUIPE} pessoas. Escolha outra equipe.`); return; }
      Object.assign(ONL, { papel: "equipe", codigo: r.sala.codigo, token: r.token, nome: r.nome, seat: r.seat, sala: r.sala });
      onlGuardar();
      if (r.partida) onlComecar(r.partida); else { APP.tela = "lobby"; mostrar(); }
    });
  });
}
function onlRetomar() {
  if (!ONL.sock || !ONL.codigo) return;
  const fim = (r) => {
    if (!r || !r.ok) {
      onlEsquecer(); ONL.codigo = null;
      onlSair((r && r.erro) || "A sala não existe mais.");
      return;
    }
    if (r.seat != null) ONL.seat = r.seat;
    if (r.token) ONL.token = r.token;
    ONL.sala = r.sala; onlGuardar();
    if (!r.partida) { ONL.ativo = false; APP.tela = "lobby"; mostrar(); return; }
    if (ONL.ativo) {
      (r.partida.log || []).forEach((j) => onlReceber(j));
      if (ONL.fimPendente && EST.falando && !CENA.ocupada) acao("fimResp", {});
      ONL.fimPendente = false;
      atualizarTudo(); return;
    }
    onlComecar(r.partida);
  };
  if (ONL.papel === "prof") ONL.sock.emit("prof:retomar", { codigo: ONL.codigo, token: ONL.token }, fim);
  else ONL.sock.emit("aluno:entrar", { codigo: ONL.codigo, nome: ONL.nome, token: ONL.token }, fim);
}
function onlComecar(p) {
  ONL.ativo = true; ONL.prox = 0; APP.fim = false;
  EST = estNovo(p.jogadores || [], p.seed);
  ONL.refazendo = true;
  try { (p.log || []).forEach((j) => onlReceber(j)); } finally { ONL.refazendo = false; }
  APP.tela = "jogo";
  mostrar();
  if (ONL.papel === "prof") {
    if (!EST.aberta) mostrarAbertura(); else { $("abertura").classList.add("oculto"); cenaRetomar(); }
  }
}
function onlReceber(j) {
  if (!ONL.ativo || !j || j.seq < ONL.prox) return;
  if (j.seq > ONL.prox) { onlPedirFaltantes(); return; }
  ONL.prox++;
  aplicar(j, !ONL.refazendo);
}
function onlPedirFaltantes() {
  if (ONL.sinc || !ONL.sock) return;
  ONL.sinc = true;
  ONL.sock.emit("sync", { desde: ONL.prox }, (r) => { ONL.sinc = false; if (r && r.ok && r.log) r.log.forEach((j) => onlReceber(j)); });
}
function onlSair(texto) {
  if (ONL.sock) { try { ONL.sock.disconnect(); } catch (e) {} ONL.sock = null; }
  onlEsquecer();
  Object.assign(ONL, { papel: null, codigo: null, token: null, nome: null, seat: null, sala: null, ativo: false, prox: 0 });
  APP.ensaio = false; APP.fim = false; EST = null;
  pararCena();
  APP.tela = "entrada"; mostrar(); msg(texto || "");
}

function gestoBracos() {
  if (!GESTO.nome || GESTO.nome === "sorriso") return {};
  const agora = performance.now();
  let k = Math.min(1, (agora - GESTO.t0) / 1100);                 /* sobe devagar */

async function processarFila() {
  if (CENA.ocupada || !CENA.fila.length) return;
  CENA.ocupada = true;

  if (it.k === "narr") {

  } else {

const espera = (ms) => new Promise((r) => setTimeout(r, ms));
/* ---------- voz simulada ----------
   Enquanto a personagem fala, toca uma "língua própria": sílabas sem sentido feitas com
   síntese de formantes (vogais) e sopros curtos (consoantes), com entonação de frase.
   Volume baixo e timbre suave, porque é um atendimento. O narrador não tem voz. */
const VOZ = {
  ctx: null, volume: 0.6,      /* os formantes deixam passar pouca energia: com 0,6 a fala fica perto de −25 dBFS (baixa, sem cobrir a sala) */
  /* cada personagem tem timbre próprio: altura, forma de onda, ressonância (formantes), sopro, ritmo e tremor */
  P: { f0: 150, var: 0.06, sil: [140, 210], tremor: 0.035, tremorHz: 5, brilho: 1700, onda: "triangle", forma: 0.88, sopro: 0.22, ganho: 1.6 },   /* Dona Lourdes: grave, abafada, soprosa, lenta, com tremor */
  A: { f0: 245, var: 0.10, sil: [85, 130], tremor: 0, tremorHz: 0, brilho: 3600, onda: "sawtooth", forma: 1.12, sopro: 0.03, ganho: 0.95 }       /* Sônia: aguda, clara e firme, mais rápida */

}
function falaSimulada(quem, texto) {

        let f = cfg.f0 * (1 + (Math.random() - 0.5) * cfg.var) * (1.06 - 0.12 * prog);
        if (pergunta && prog > 0.7) f *= 1 + (prog - 0.7) * 0.6;
        const [F1, F2] = FORMANTES[Math.floor(Math.random() * FORMANTES.length)].map((x) => x * cfg.forma);

  texto3(c, "3", x + r - 9, y - 2, "#222"); texto3(c, "9", x - r + 6, y - 2, "#222");
  const seg = (Date.now() - INICIO_CENA) / 1000;
  const min = 40 + seg / 60, hora = 10 + min / 60;
  const ah = (hora % 12) / 12 * Math.PI * 2 - Math.PI / 2, am = (min % 60) / 60 * Math.PI * 2 - Math.PI / 2, as = (seg % 60) / 60 * Math.PI * 2 - Math.PI / 2;
  linha(c, [x, y, x + Math.cos(ah) * 9.5, y + Math.sin(ah) * 9.5], "#1b1b1b", 2.2);
  linha(c, [x, y, x + Math.cos(am) * 14.5, y + Math.sin(am) * 14.5], "#1b1b1b", 1.5);
  linha(c, [x - Math.cos(as) * 3, y - Math.sin(as) * 3, x + Math.cos(as) * 15.5, y + Math.sin(as) * 15.5], "#c23b3b", 0.7);
  elip(c, x, y, 1.4, 1.4, "#c23b3b");
}

/* ---------- rosto genérico (velha ou adulta) ---------- */
function rosto(c, x, y, o) {
  const rx = o.rx, ry = o.ry;
  /* orelhas */
  elip(c, x - rx + 0.5, y + 1, 3, 5.5, o.sombra); elip(c, x + rx - 0.5, y + 1, 3, 5.5, o.sombra);
  elip(c, x - rx + 0.8, y + 1, 1.6, 3.6, o.pele); elip(c, x + rx - 0.8, y + 1, 1.6, 3.6, o.pele);
  if (o.brinco) { elip(c, x - rx + 0.5, y + 6, 1.4, 1.4, o.brinco); elip(c, x + rx - 0.5, y + 6, 1.4, 1.4, o.brinco); }
  /* formato do rosto */
  c.beginPath();
  c.moveTo(x, y - ry);
  c.bezierCurveTo(x + rx * 1.02, y - ry, x + rx * 1.04, y + ry * 0.2, x + rx * (o.papada ? 0.86 : 0.78), y + ry * 0.6);
  c.bezierCurveTo(x + rx * 0.55, y + ry * 0.96, x + rx * 0.25, y + ry, x, y + ry);
  c.bezierCurveTo(x - rx * 0.25, y + ry, x - rx * 0.55, y + ry * 0.96, x - rx * (o.papada ? 0.86 : 0.78), y + ry * 0.6);
  c.bezierCurveTo(x - rx * 1.04, y + ry * 0.2, x - rx * 1.02, y - ry, x, y - ry);
  c.fillStyle = rg(c, x - rx * 0.4, y - ry * 0.3, 1, rx * 1.7, [[0, o.luz], [0.45, o.pele], [1, o.sombra]]);
  c.fill();
  /* sombra do lado direito do quadro (luz vem da janela, à esquerda) */
  c.save(); c.clip();
  c.fillStyle = lg(c, x, 0, x + rx, 0, [[0, "rgba(90,50,30,0)"], [1, "rgba(90,50,30,.28)"]]); c.fillRect(x, y - ry, rx + 2, ry * 2);
  if (o.idade) {                             /* papada e flacidez da mandíbula */
    c.fillStyle = "rgba(110,60,40,.18)";
    elip(c, x - rx * 0.62, y + ry * 0.72, rx * 0.3, ry * 0.16, "rgba(110,60,40,.16)");
    elip(c, x + rx * 0.62, y + ry * 0.74, rx * 0.3, ry * 0.16, "rgba(110,60,40,.2)");
  }
  c.restore();
  /* bochechas */
  elip(c, x - rx * 0.5, y + ry * 0.25, rx * 0.25, ry * 0.14, o.blush);
  elip(c, x + rx * 0.5, y + ry * 0.25, rx * 0.25, ry * 0.14, o.blush);
  if (o.manchas) o.manchas.forEach(([dx, dy]) => elip(c, x + dx, y + dy, 0.9, 0.7, "rgba(140,90,55,.45)"));

  /* olhos */
  const ey = y - ry * 0.08, ex = rx * 0.42;
  const lado = [-1, 1];
  lado.forEach((s) => {
    const cxo = x + s * ex;
    elip(c, cxo, ey - 0.4, 4.8, 3.2, "rgba(100,52,38,.32)");                   /* órbita */
    elip(c, cxo - 0.6, ey - 3.4, 3.6, 1.2, "rgba(255,235,215,.25)");             /* luz sob a sobrancelha */
    if (o.piscar) {
      curva(c, cxo - 3.2, ey, cxo, ey + 1.1, cxo + 3.2, ey, o.contorno, 0.9);
    } else {
      elip(c, cxo, ey, 3.1, 1.6, "#efe8e0");
      const ox = cxo + (o.olhar || 0) * 1.2 + 0.2;
      elip(c, ox, ey + 0.1, 1.65, 1.65, o.iris);
      elip(c, ox, ey + 0.1, 0.75, 0.75, "#140c0a");
      c.fillStyle = "#fff"; c.fillRect(ox - 1.1, ey - 1, 1, 1);
      curva(c, cxo - 2.8, ey + 1.3, cxo, ey + 2, cxo + 2.8, ey + 1.2, "rgba(90,45,30,.35)", 0.6);   /* pálpebra inferior */
      /* pálpebra superior (caída na idosa) */
      c.beginPath(); c.moveTo(cxo - 3.6, ey - 0.2);
      c.quadraticCurveTo(cxo, ey - (o.palpebra ? 2.2 : 2.8), cxo + 3.6, ey + (o.palpebra ? 0.3 : -0.2));
      c.lineTo(cxo + 3.6, ey - 3); c.lineTo(cxo - 3.6, ey - 3); c.closePath();
      c.fillStyle = o.pele; c.fill();
      curva(c, cxo - 3.4, ey - 0.1, cxo, ey - (o.palpebra ? 2.1 : 2.6), cxo + 3.4, ey + (o.palpebra ? 0.4 : -0.1), o.contorno, o.cilios ? 1.1 : 0.8);
    }
    if (o.idade) {                          /* bolsas e pés de galinha */
      curva(c, cxo - 2.6, ey + 2.4, cxo, ey + 3.6, cxo + 2.8, ey + 2.2, "rgba(110,60,40,.35)", 0.7);
      for (let k = -1; k <= 1; k++) linha(c, [cxo + s * 4.2, ey + k * 1.2, cxo + s * 5.8, ey + k * 1.8], "rgba(110,60,40,.3)", 0.5);
    }
    /* sobrancelha */
    const hum = o.humor;
    const inn = hum === "triste" || hum === "pensa" ? -1.4 : 0, out = hum === "triste" ? 0.8 : 0;
    curva(c, cxo - s * 3.6, ey - 4.4 + inn * (s === -1 ? 1 : 1) * 0.9 + (hum === "pensa" && s === 1 ? 0.8 : 0), cxo, ey - 5.6 + inn * 0.3, cxo + s * 3.8, ey - 4.2 + out, o.sobr, o.sobrL || 1.1);
  });
  /* rugas da testa */
  if (o.idade) {
    for (let k = 0; k < 3; k++) curva(c, x - rx * 0.45, y - ry * 0.5 - k * 2.6, x, y - ry * 0.56 - k * 2.6 - 0.6, x + rx * 0.45, y - ry * 0.5 - k * 2.6, "rgba(110,60,40,.22)", 0.6);
  }
  /* nariz: luz à esquerda, sombra à direita */
  const ny = y + ry * 0.24;
  linha(c, [x + 1.4, ey + 1.5, x + 2.2, ny - 1], "rgba(110,60,40,.35)", 0.9);
  elip(c, x - 0.3, ny - 0.4, 2.4, 1.7, o.luz);
  elip(c, x + 0.4, ny + 2.1, 3.2, 0.9, "rgba(90,45,30,.25)");                     /* sombra sob o nariz */
  curva(c, x - 3, ny + 0.2, x - 3.4, ny + 1.8, x - 1.8, ny + 1.9, "rgba(90,45,30,.35)", 0.6);
  curva(c, x + 3, ny + 0.2, x + 3.4, ny + 1.8, x + 1.8, ny + 1.9, "rgba(90,45,30,.45)", 0.6);
  elip(c, x + 1.6, ny + 0.5, 1.2, 1.2, "rgba(110,60,40,.25)");
  elip(c, x - 1.5, ny + 1.1, 0.8, 0.5, "rgba(60,30,20,.55)"); elip(c, x + 1.5, ny + 1.1, 0.8, 0.5, "rgba(60,30,20,.55)");
  /* boca */
  const my = y + ry * 0.5, mw = rx * 0.42;
  const dr = o.droop || 0;                        /* lado esquerdo da paciente = direita do quadro */
  const sorri = o.humor === "sorri" ? 1 : 0, triste = o.humor === "triste" ? 1 : 0;
  if (o.idade) {                                  /* sulcos nasolabiais (mais fracos do lado paralisado) */
    curva(c, x - 3.2, ny + 1.5, x - mw - 1.4, my - 1, x - mw - 1, my + 2.6, "rgba(110,60,40,.4)", 0.8);
    curva(c, x + 3.2, ny + 1.5, x + mw + 1.2, my, x + mw + 1.2, my + 3.4, `rgba(110,60,40,${0.4 - dr * 0.25})`, 0.7);
    linha(c, [x - mw - 0.6, my + 2.4, x - mw + 0.2, my + 5.6], "rgba(110,60,40,.28)", 0.6);    /* rugas de marionete */
    linha(c, [x + mw + 0.6, my + 2.8 + dr, x + mw - 0.2, my + 6], "rgba(110,60,40,.28)", 0.6);
  }
  const ab = o.boca || 0;
  const yE = my - sorri * 1.1 + triste * 0.7, yD = my - sorri * 1.1 * (1 - dr) + triste * 0.7 + dr * 1.3;
  if (ab > 0.08) {
    c.beginPath();
    c.moveTo(x - mw, yE);
    c.quadraticCurveTo(x, my - 0.8 - sorri * 0.4, x + mw * (1 - dr * 0.15), yD);
    c.quadraticCurveTo(x, my + ab * 3.4 + 0.6, x - mw, yE);
    c.fillStyle = "#4a1e1e"; c.fill();
    c.save(); c.clip();
    c.fillStyle = o.dentes; c.fillRect(x - mw, my - 1.2, mw * 2, 1.3 + ab * 0.6);
    elip(c, x, my + ab * 2.6, mw * 0.5, ab * 0.9, "#b4545a");
    c.restore();
    curva(c, x - mw, yE, x, my - 1.2 - sorri * 0.4, x + mw, yD, o.labio, 0.9);
  } else {
    curva(c, x - mw - 0.4, yE, x, my + 0.4 - sorri * 0.2 + triste * 0.2 - (sorri ? 0 : 0), x + mw + 0.4, yD, o.labio2, 1.2);
    curva(c, x - mw * 0.6, my + 1.3, x, my + 2.2, x + mw * 0.6, my + 1.3 + dr * 0.4, o.labio, 1);     /* lábio inferior */
  }
  /* óculos */
  if (o.oculos) {
    lado.forEach((s) => {
      const cxo = x + s * ex;
      c.fillStyle = "rgba(220,235,255,.13)"; rrect(c, cxo - 5.2, ey - 4.1, 10.4, 7.6, 2.4); c.fill();
      c.strokeStyle = o.oculos; c.lineWidth = 0.9; rrect(c, cxo - 5.2, ey - 4.1, 10.4, 7.6, 2.4); c.stroke();
      linha(c, [cxo - 3.6 + s, ey - 3, cxo - 1.6 + s, ey - 1], "rgba(255,255,255,.55)", 0.7);
    });
    curva(c, x - ex + 5.2, ey - 1.6, x, ey - 3, x + ex - 5.2, ey - 1.6, o.oculos, 0.9);
    linha(c, [x - ex - 5.2, ey - 1.6, x - rx + 0.6, ey - 1], o.oculos, 0.8);
    linha(c, [x + ex + 5.2, ey - 1.6, x + rx - 0.6, ey - 1], o.oculos, 0.8);
  }
}

/* ---------- personagens ----------
   Desenhados em coordenadas "de base" e ampliados (ESC) a partir da borda da mesa,
   para o rosto ter pixels suficientes para os detalhes. */
const ESC = 1.36, ANC_X = 240, ANC_Y = 214;
function emEscala(c, fn) { c.save(); c.translate(ANC_X, ANC_Y); c.scale(ESC, ESC); c.translate(-ANC_X, -ANC_Y); fn(); c.restore(); }

/* tronco com ombros, braços separados do corpo e sombra nas dobras */
/* ---------- cabelo da Sônia: chanel longo escovado, repartido de lado, pontas viradas (anos 90) ---------- */
const CAB = { base: "#57291d", claro: "#8a4a33", escuro: "#331610", brilho: "rgba(236,176,134,.55)" };
function cabeloTrasFilha(c, cx, fy) {
  /* massa de trás: aparece em volta do rosto e atrás do pescoço, até os ombros */
  c.beginPath();
  c.moveTo(cx, fy - 23);
  c.bezierCurveTo(cx + 16, fy - 24, cx + 22, fy - 12, cx + 21.5, fy + 2);
  c.bezierCurveTo(cx + 21, fy + 14, cx + 22, fy + 24, cx + 20, fy + 30);
  c.quadraticCurveTo(cx, fy + 33, cx - 20, fy + 30);
  c.bezierCurveTo(cx - 22, fy + 24, cx - 21, fy + 14, cx - 21.5, fy + 2);
  c.bezierCurveTo(cx - 22, fy - 12, cx - 16, fy - 24, cx, fy - 23);
  c.closePath();
  c.fillStyle = lg(c, cx - 22, 0, cx + 22, 0, [[0, "#4a2218"], [0.5, CAB.escuro], [1, "#2a120c"]]); c.fill();
}
function cabeloFrenteFilha(c, cx, fy) {
  const fio = (pts, cor, larg) => { c.beginPath(); c.moveTo(pts[0], pts[1]); c.bezierCurveTo(pts[2], pts[3], pts[4], pts[5], pts[6], pts[7]); c.strokeStyle = cor; c.lineWidth = larg; c.lineCap = "round"; c.stroke(); };
  const px = cx - 5;                          /* risca do cabelo, à esquerda de quem olha */
  /* lado direito do quadro: a franja varre a testa e desce emoldurando o rosto */
  const ladoD = () => {
    c.beginPath();
    c.moveTo(px, fy - 22.5);
    c.bezierCurveTo(cx + 8, fy - 25, cx + 20, fy - 18, cx + 21, fy - 4);
    c.bezierCurveTo(cx + 22, fy + 10, cx + 22.5, fy + 22, cx + 23, fy + 28);
    c.quadraticCurveTo(cx + 22, fy + 31.5, cx + 17, fy + 29.5);          /* ponta virada para dentro */
    c.bezierCurveTo(cx + 16.5, fy + 18, cx + 15.8, fy + 4, cx + 14.4, fy - 6);
    c.bezierCurveTo(cx + 11, fy - 12, cx + 4, fy - 13.5, cx - 2, fy - 11);  /* borda da franja sobre a testa */
    c.bezierCurveTo(cx - 3.5, fy - 15, px - 0.5, fy - 19, px, fy - 22.5);
    c.closePath();
  };
  const ladoE = () => {
    c.beginPath();
    c.moveTo(px, fy - 22.5);
    c.bezierCurveTo(cx - 12, fy - 24, cx - 20, fy - 16, cx - 21, fy - 4);
    c.bezierCurveTo(cx - 22, fy + 10, cx - 22, fy + 22, cx - 22.5, fy + 28);
    c.quadraticCurveTo(cx - 21.5, fy + 31.5, cx - 16.5, fy + 29.5);
    c.bezierCurveTo(cx - 16, fy + 18, cx - 15.6, fy + 4, cx - 14.3, fy - 6);
    c.bezierCurveTo(cx - 13, fy - 11, cx - 10, fy - 14, px - 1, fy - 17);
    c.quadraticCurveTo(px - 0.5, fy - 20, px, fy - 22.5);
    c.closePath();
  };
  [ladoE, ladoD].forEach((lado, i) => {
    lado();
    c.fillStyle = lg(c, cx - 22, fy - 24, cx + 22, fy + 30, i ? [[0, "#7a3d2a"], [0.45, CAB.base], [1, "#3c1b13"]] : [[0, "#6c3526"], [0.6, "#4a2218"], [1, "#331610"]]);
    c.fill();
    c.save(); lado(); c.clip();
    /* fios: seguem o caimento, alternando claros e escuros */
    const R = rnd(31 + i);
    for (let k = 0; k < 14; k++) {
      const d = (k / 13), s = i ? 1 : -1;
      const x0 = px + s * (1 + d * 3), y0 = fy - 22 + d * 2;
      const x3 = cx + s * (14.5 + d * 8 + (R() - 0.5) * 1.5), y3 = fy + 18 + d * 12;
      const cor = k % 3 === 0 ? CAB.claro : k % 3 === 1 ? CAB.escuro : "rgba(120,62,42,.8)";
      fio([x0, y0, cx + s * (10 + d * 12), fy - 22 + d * 3, cx + s * (17 + d * 6), fy - 6 + d * 4, x3, y3], cor, 0.55);
    }
    /* volume escovado: sombra perto do rosto, brilho em cima */
    fio([px + (i ? 2 : -2), fy - 21.5, cx + (i ? 12 : -10), fy - 23, cx + (i ? 19 : -18), fy - 14, cx + (i ? 20 : -19.5), fy - 4], CAB.brilho, 1.3);
    fio([cx + (i ? 15 : -15), fy - 4, cx + (i ? 16 : -16), fy + 8, cx + (i ? 16.5 : -16.5), fy + 18, cx + (i ? 17.5 : -17), fy + 28], "rgba(30,12,8,.55)", 1.2);
    c.restore();
  });
  /* risca com fios brancos na raiz (tinta que já está crescendo) */
  fio([px, fy - 22.6, px + 0.4, fy - 20.5, px + 0.2, fy - 18.6, px - 0.6, fy - 17], "rgba(214,206,196,.85)", 0.6);
  fio([px + 1.2, fy - 22.6, px + 2.4, fy - 22.4, px + 3.6, fy - 22.2, px + 4.8, fy - 22], "rgba(214,206,196,.6)", 0.5);
  /* mechas soltas nas pontas */
  fio([cx + 19, fy + 22, cx + 20, fy + 26, cx + 21.5, fy + 29, cx + 23.5, fy + 30], CAB.base, 0.8);
  fio([cx - 18.5, fy + 22, cx - 19.5, fy + 26, cx - 21, fy + 29, cx - 23, fy + 30], "#4a2218", 0.8);
}

/* ---------- movimento natural ----------
   Respiração lenta, balanço irregular (soma de ondas lentas), acenos curtos quando fala
   e a cabeça que se vira para quem está falando; tudo suavizado para não haver saltos. */
const MOV = { P: { rot: 0, dx: 0, nod: 0 }, A: { rot: 0, dx: 0, nod: 0 } };
function movimento(k, t) {
  const m = MOV[k], fase = k === "P" ? 0 : 2.1;
  const resp = Math.sin(t / (k === "P" ? 1900 : 1650) + fase);             /* ciclo de ~12 a 13 respirações por minuto */
  const balX = 0.45 * Math.sin(t / 2600 + fase) + 0.25 * Math.sin(t / 1430 + fase * 2);
  const balR = 0.018 * Math.sin(t / 3100 + fase) + 0.01 * Math.sin(t / 1730 + 1 + fase);
  const fala = CENA.falando === k;
  /* acenos de quem fala: pequenos e irregulares */
  const nodAlvo = fala ? 0.55 * Math.max(0, Math.sin(t / 210)) * (0.6 + 0.4 * Math.sin(t / 830)) : 0;
  /* para onde a cabeça se vira: a filha olha para a mãe quando ela fala; a mãe olha para a filha às vezes */
  let rotAlvo = 0, dxAlvo = 0;
  if (k === "A" && CENA.falando === "P") { rotAlvo = -0.07; dxAlvo = -1.1; }
  if (k === "P" && CENA.falando === "A") { rotAlvo = 0.05; dxAlvo = 0.7; }
  if (k === "P" && CENA.humor.P === "triste") rotAlvo -= 0.03;
  if (k === "P" && CENA.humor.P === "pensa") rotAlvo += 0.04;
  m.rot += (rotAlvo - m.rot) * 0.06; m.dx += (dxAlvo - m.dx) * 0.06; m.nod += (nodAlvo - m.nod) * 0.25;
  return {
    by: resp * 0.55,                                       /* ombros e peito */
    hx: balX + m.dx, hy: resp * 0.3 + m.nod,               /* cabeça */
    rot: balR + m.rot + m.nod * 0.035,
    sx: balX * 0.25                                        /* o tronco acompanha um pouco o balanço */
  };
}
/* aplica o movimento da cabeça girando em torno do queixo/pescoço */
function cabeca(c, cx, pivoY, mv, fn) {
  c.save(); c.translate(cx + mv.hx, pivoY + mv.hy); c.rotate(mv.rot); c.translate(-cx, -pivoY); fn(); c.restore();
}

function tronco(c, cx, topo, o) {
  /* silhueta única (ombros + braços + tronco) com contorno feminino: ombros arredondados,
     braços finos junto ao corpo e cintura marcada; as mãos ficam sobre as coxas, abaixo da mesa */
  const L = o.larg, by = o.by, sh = o.ombroCaido || 4, q = o.ombroQuadrado ? 0.6 : 1;
  const yo = topo + by;
  const ergue = o.ergue || {};                 /* braço levantado: sai da silhueta (é desenhado à parte) */
  const sil = () => {
    c.beginPath();
    c.moveTo(cx - 7, yo - 1);
    c.bezierCurveTo(cx - L * 0.3, yo + 0.5, cx - L * 0.58, yo + sh * 0.55, cx - L * 0.78, yo + sh);         /* trapézio */
    if (ergue[-1] > 0.02) { c.bezierCurveTo(cx - L * 0.88, yo + sh + 2, cx - L * 0.9, yo + sh + 12, cx - L * 0.8, yo + sh + 24); c.bezierCurveTo(cx - L * 0.74, 190, cx - L * 0.76, 210, cx - L * 0.78, 232); }
    else {
      c.bezierCurveTo(cx - L * (0.93 + 0.05 * q), yo + sh + 1, cx - L * 1.02, yo + sh + 7 * q, cx - L * 1.02, yo + sh + 16);  /* ombro redondo */
      c.bezierCurveTo(cx - L * 1.03, yo + 40, cx - L * 0.97, 188, cx - L * 0.95, 232);                     /* braço afinando */
    }
    c.lineTo(cx + (ergue[1] > 0.02 ? L * 0.78 : L * 0.95), 232);
    if (ergue[1] > 0.02) { c.bezierCurveTo(cx + L * 0.76, 210, cx + L * 0.74, 190, cx + L * 0.8, yo + sh + 24); c.bezierCurveTo(cx + L * 0.9, yo + sh + 12, cx + L * 0.88, yo + sh + 2, cx + L * 0.78, yo + sh); }
    else {
      c.bezierCurveTo(cx + L * 0.97, 188, cx + L * 1.03, yo + 40, cx + L * 1.02, yo + sh + 16);
      c.bezierCurveTo(cx + L * 1.02, yo + sh + 7 * q, cx + L * (0.93 + 0.05 * q), yo + sh + 1, cx + L * 0.78, yo + sh);
    }
    c.bezierCurveTo(cx + L * 0.58, yo + sh * 0.55, cx + L * 0.3, yo + 0.5, cx + 7, yo - 1);
    c.closePath();
  };
  sil();
  c.fillStyle = lg(c, cx - L * 1.05, 0, cx + L * 1.05, 0, [[0, o.c1], [0.42, o.c2], [1, o.c3]]); c.fill();
  c.save(); sil(); c.clip();
  if (o.textura) o.textura(c);

function bracoErguido(c, x0, y0, s, ang, o) {
  const tremor = s === 1 && o.tremeEsq ? Math.sin(performance.now() / 55) * 0.035 : 0;

  const x1 = x0 + s * Math.sin(a1) * 30, y1 = y0 + Math.cos(a1) * 30;
  const x2 = x1 + s * Math.sin(a2) * 27, y2 = y1 + Math.cos(a2) * 27;
  c.lineCap = "round"; c.lineJoin = "round";
  [[o.linha, 12.5, 10.5], [o.c2, 10.5, 8.5]].forEach(([cor, l1, l2]) => {
    c.strokeStyle = cor; c.lineWidth = l1; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
    c.lineWidth = l2; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  });
  linha(c, [x0 - s * 2, y0 + 2, x1 - s * 2, y1 + 1], "rgba(255,255,255,.12)", 2);   /* luz na manga */
  /* punho e mão (simples, de lado) */
  const hx = x2 + s * Math.sin(a2) * 5, hy = y2 + Math.cos(a2) * 5;
  linha(c, [x2 - Math.cos(a2) * 4.5, y2 + s * Math.sin(a2) * 4.5, x2 + Math.cos(a2) * 4.5, y2 - s * Math.sin(a2) * 4.5], o.linha, 1.2);
  elip(c, hx, hy, 4.2, 3.4, o.mao || "#d3a07b", a2 * s);
  elip(c, hx - 0.8, hy - 0.8, 2.6, 1.8, "rgba(255,230,200,.5)", a2 * s);
}

/* ---------- laço principal ---------- */
function quadro(agora) {
  rafId = requestAnimationFrame(quadro);
  if (agora - ultimo < 1000 / 24) return;
  ultimo = agora;
  const t = agora;
  /* piscar */
  ["P", "A"].forEach((k) => {
    if (t > PISC[k].prox) { PISC[k].ate = t + (k === "P" ? 170 : 120); PISC[k].prox = t + 2200 + Math.random() * 3600; }
  });
  /* boca: abre e fecha enquanto fala */
  if (t - BOCA.t > 85) {
    BOCA.t = t;
    ["P", "A"].forEach((k) => { BOCA[k] = CENA.falando === k ? (Math.random() < 0.25 ? 0 : 0.35 + Math.random() * 0.65) : 0; });
  }
  g.clearRect(0, 0, W, H);
  g.drawImage(FUNDO, 0, 0);
  desenharRelogio(g);
  /* camada da frente (por cima da radiografia): personagens, cadeiras e mesa */
  gF.clearRect(0, 0, W, H);
  emEscala(gF, () => { desenharFilha(gF, t); desenharPaciente(gF, t); });
  desenharMesa(gF);
  gF.fillStyle = rg(gF, W / 2, H / 2, 120, 300, [[0, "rgba(0,0,0,0)"], [1, "rgba(0,0,0,.28)"]]); gF.fillRect(0, 0, W, H);   /* leve vinheta */
}
function iniciarCena() {
  if (!FUNDO) FUNDO = desenharFundo();
  if (!rafId) rafId = requestAnimationFrame(quadro);
}
