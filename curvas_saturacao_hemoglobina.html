<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise das curvas de saturação da hemoglobina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#eef3f8;--panel:#fff;--grid:#e0eaf3;--ink:#16293b;--ink-soft:#57697a;
    --line:#cbd7e2;--line-soft:#dce6ef;--accent:#d81f4a;--teal:#0d7b85;--teal-bg:#e0f1f2;
    --field:#f4f8fb;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--ink);background-color:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:22px 22px;line-height:1.5;padding:0 16px 40px;}

  .toolbar{position:sticky;top:0;z-index:30;margin:0 -16px;padding:10px 20px;background:rgba(238,243,248,.92);
    backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .tb-title{font-weight:600;font-size:.95rem;}
  .tb-title span{color:var(--ink-soft);font-weight:400;}
  .tb-spacer{flex:1;}
  .tb-prog{font-family:"IBM Plex Mono",monospace;font-size:.82rem;color:var(--ink-soft);}
  .ruler-toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:7px 14px;
    border:1.5px solid var(--line);border-radius:999px;background:var(--panel);font-size:.9rem;font-weight:500;transition:.15s;}
  .ruler-toggle:hover{border-color:var(--teal);}
  .ruler-toggle .sw{width:38px;height:22px;border-radius:999px;background:#c7d3de;position:relative;transition:.18s;flex:0 0 auto;}
  .ruler-toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:.18s;}
  body.ruler .ruler-toggle{border-color:var(--teal);background:var(--teal-bg);color:var(--teal);}
  body.ruler .ruler-toggle .sw{background:var(--teal);}
  body.ruler .ruler-toggle .sw::after{transform:translateX(16px);}

  .wrap{max-width:1080px;margin:0 auto;}

  header.report{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 30px;margin:26px 0 18px;}
  header.report h1{font-size:1.85rem;line-height:1.12;margin:0 0 14px;font-weight:600;letter-spacing:-.01em;}
  .idrow{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end;}
  .idfield{flex:1;min-width:220px;}
  .idfield.date{flex:0 0 170px;min-width:150px;}
  .idfield label{display:block;font-size:.78rem;font-weight:600;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.02em;}
  .idfield input{width:100%;font-family:"IBM Plex Sans",sans-serif;font-size:1.05rem;color:var(--ink);border:none;
    border-bottom:2px solid var(--line);background:transparent;padding:6px 2px;}
  .idfield input:focus{outline:none;border-bottom-color:var(--teal);}
  .name-warn{color:var(--accent);font-size:.82rem;margin:8px 0 0;min-height:1em;}

  .page{display:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .page.active{display:block;}
  .ex-head{display:flex;align-items:baseline;gap:12px;padding:20px 28px 4px;flex-wrap:wrap;}
  .ex-tag{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.8rem;color:#fff;background:var(--ink);
    padding:4px 10px;border-radius:6px;letter-spacing:.04em;}
  .ex-title{font-weight:600;font-size:1.18rem;}
  .ex-enun{width:100%;color:var(--ink);font-size:.95rem;line-height:1.5;padding:6px 28px 0;}
  .ex-body{display:grid;grid-template-columns:minmax(0,580px) 1fr;gap:14px 34px;padding:16px 28px 26px;align-items:start;}
  .ex-body.no-plot{grid-template-columns:1fr;max-width:720px;}

  .plot-col{position:sticky;top:66px;}
  .plot{position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px;line-height:0;}
  .plot img{display:block;width:100%;height:auto;border-radius:4px;}
  .plot .crossv,.plot .crossh,.plot .dot{position:absolute;pointer-events:none;opacity:0;}
  .plot .crossv{top:10px;bottom:10px;width:0;border-left:1.4px solid var(--accent);}
  .plot .crossh{left:10px;right:10px;height:0;border-top:1.4px solid var(--accent);}
  .plot .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);
    box-shadow:0 0 0 2px rgba(255,255,255,.8);}
  body.ruler .plot{cursor:crosshair;}
  body.ruler .plot.active .crossv,body.ruler .plot.active .crossh,body.ruler .plot.active .dot,
  body.ruler .plot.frozen .crossv,body.ruler .plot.frozen .crossh,body.ruler .plot.frozen .dot{opacity:1;}
  .freeze-note{position:absolute;top:14px;left:14px;font-family:"IBM Plex Mono",monospace;font-size:.7rem;
    background:var(--accent);color:#fff;padding:2px 7px;border-radius:5px;opacity:0;transition:.15s;}
  body.ruler .plot.frozen .freeze-note{opacity:1;}

  .rows{display:flex;flex-direction:column;gap:2px;}
  .row{padding:12px 2px;border-bottom:1px solid var(--line-soft);}
  .row:last-child{border-bottom:none;}
  .qtext{font-size:.98rem;margin-bottom:10px;}
  .ans{display:flex;flex-wrap:wrap;gap:14px;}
  .ans-field{display:flex;flex-direction:column;gap:5px;}
  .ans-label{font-size:.74rem;font-weight:600;color:var(--ink-soft);letter-spacing:.02em;}
  .field{display:inline-flex;align-items:stretch;border:1.5px solid var(--line);border-radius:8px;background:var(--field);overflow:hidden;transition:.15s;}
  .field:focus-within{border-color:var(--teal);background:#fff;box-shadow:0 0 0 3px rgba(13,123,133,.12);}
  .field input{width:92px;border:none;background:transparent;padding:9px 10px;font-family:"IBM Plex Mono",monospace;
    font-size:1.02rem;font-weight:500;color:var(--ink);text-align:right;}
  .field input:focus{outline:none;}
  .field .unit{display:flex;align-items:center;padding:0 11px;background:#eaf0f6;color:var(--ink-soft);
    font-family:"IBM Plex Mono",monospace;font-size:.82rem;border-left:1.5px solid var(--line);white-space:nowrap;}
  .seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg-opt{position:relative;}
  .seg-opt input{position:absolute;opacity:0;width:100%;height:100%;left:0;top:0;margin:0;cursor:pointer;}
  .seg-opt span{display:block;padding:9px 16px;font-size:.9rem;color:var(--ink-soft);cursor:pointer;
    border-left:1.5px solid var(--line);transition:.12s;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .seg-opt:first-child span{border-left:none;}
  .seg-opt input:checked + span{background:var(--teal);color:#fff;font-weight:600;}

  .pagenav{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:18px 2px 0;flex-wrap:wrap;}
  .dots{display:flex;gap:9px;align-items:center;}
  .dot-nav{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;padding:0;transition:.15s;}
  .dot-nav.on{background:var(--teal);border-color:var(--teal);transform:scale(1.15);}
  .dot-nav.filled{border-color:var(--teal);}
  .navbtn{font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:1rem;border-radius:10px;cursor:pointer;
    padding:12px 22px;display:inline-flex;align-items:center;gap:9px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);}
  .navbtn:hover{background:rgba(22,41,59,.05);}
  .navbtn.prim{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 3px 0 #0c1926;}
  .navbtn.prim:hover{background:#0f2131;}
  .navbtn.prim:active{transform:translateY(2px);box-shadow:0 1px 0 #0c1926;}
  .navbtn.save{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 3px 0 #0a5c64;}
  .navbtn.save:hover{background:#0b6b74;}
  .navbtn.save:active{transform:translateY(2px);box-shadow:0 1px 0 #0a5c64;}
  .navbtn[disabled]{opacity:.35;cursor:not-allowed;box-shadow:none;}
  .navbtn svg{width:18px;height:18px;}

  footer.autoria{max-width:1080px;margin:30px auto 0;padding:16px 4px 0;border-top:1px solid var(--line);
    text-align:left;color:var(--ink-soft);font-size:.86rem;line-height:1.7;}
  footer.autoria .aut-nome{color:var(--ink);font-weight:600;}
  footer.autoria .aut-meta{font-family:"IBM Plex Mono",monospace;font-size:.8rem;}

  @media (max-width:860px){
    .ex-body{grid-template-columns:1fr;}
    .plot-col{position:static;}
  }

  @media print{
    @page{margin:13mm;}
    body{background:#fff;padding:0;}
    .toolbar,.pagenav,.name-warn,.freeze-note{display:none !important;}
    .plot .crossv,.plot .crossh,.plot .dot{display:none !important;}
    .wrap{max-width:none;}
    header.report{border:none;border-bottom:2px solid var(--ink);border-radius:0;padding:0 0 14px;margin:0 0 14px;}
    .idfield input{border-bottom:1px solid var(--ink);}
    .page{display:block !important;border:1px solid #b9c6d3;border-radius:8px;margin-bottom:14px;break-inside:auto;}
    .ex-head,.ex-enun{break-inside:avoid;break-after:avoid;}
    .plot,.row{break-inside:avoid;}
    .ex-body{grid-template-columns:minmax(0,340px) 1fr;}
    .plot-col{position:static;}
    .field{background:#fff;border:1px solid #333;}
    .field .unit{background:#eee;}
    .seg-opt input:checked + span{background:var(--teal) !important;color:#fff !important;}
    footer.autoria{break-inside:avoid;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>

        ${hasImg?`<div class="plot-col"><div class="plot" data-plot="${ei}">
          <img src="${ex.img}" alt="${ex.titulo}" draggable="false">
          <div class="crossv"></div><div class="crossh"></div><div class="dot"></div>
          <span class="freeze-note">linhas congeladas · clique para soltar</span>
        </div></div>`:''}
        <div class="rows">${rows}</div>
      </div>
    </section>`;
  }).join('');
  document.getElementById('dots').innerHTML=DATA.map((_,i)=>`<button class="dot-nav" data-d="${i}" aria-label="Ir ao exercício ${i+1}"></button>`).join('');
  document.querySelectorAll('.dot-nav').forEach(d=>d.addEventListener('click',()=>go(+d.dataset.d)));
  bindNumeric(); bindRuler(); update();
}
function bindNumeric(){
  document.querySelectorAll('input[data-num]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      let v=inp.value.replace(/[^0-9.,]/g,'');
      const m=v.match(/[.,]/);
      if(m){const idx=v.indexOf(m[0]);v=v.slice(0,idx+1)+v.slice(idx+1).replace(/[.,]/g,'');}
      inp.value=v;
    });
  });
}
function bindRuler(){
  document.querySelectorAll('.plot').forEach(plot=>{
    const v=plot.querySelector('.crossv'),h=plot.querySelector('.crossh'),d=plot.querySelector('.dot');
    let frozen=false;
    function move(e){ if(frozen)return; const r=plot.getBoundingClientRect();
      const x=e.clientX-r.left,y=e.clientY-r.top; v.style.left=x+'px';h.style.top=y+'px';d.style.left=x+'px';d.style.top=y+'px'; }
    plot.addEventListener('mousemove',move);
    plot.addEventListener('mouseenter',()=>{if(document.body.classList.contains('ruler'))plot.classList.add('active');});
    plot.addEventListener('mouseleave',()=>{if(!frozen)plot.classList.remove('active');});
    plot.addEventListener('click',()=>{if(!document.body.classList.contains('ruler'))return;
      frozen=!frozen;plot.classList.toggle('frozen',frozen);if(frozen)plot.classList.add('active');});
  });
}

function update(){
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',+p.dataset.i===cur));
  document.getElementById('prog').textContent=`Exercício ${cur+1} de ${DATA.length}`;
  document.querySelectorAll('.dot-nav').forEach((d,i)=>{
    d.classList.toggle('on',i===cur); d.classList.toggle('filled',i<cur);
  });
  const prev=document.getElementById('prevBtn'),next=document.getElementById('nextBtn'),save=document.getElementById('saveBtn');
  prev.disabled = cur===0;
  const last = cur===DATA.length-1;
  next.style.display = last?'none':'inline-flex';
  save.style.display = last?'inline-flex':'none';
}
function go(i){
  cur=Math.max(0,Math.min(DATA.length-1,i));
  update();
  document.querySelectorAll('.plot').forEach(p=>p.classList.remove('active','frozen'));
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('prevBtn').addEventListener('click',()=>go(cur-1));
document.getElementById('nextBtn').addEventListener('click',()=>go(cur+1));

const rulerChk=document.getElementById('rulerChk');
rulerChk.addEventListener('change',()=>{
  document.body.classList.toggle('ruler',rulerChk.checked);
  if(!rulerChk.checked) document.querySelectorAll('.plot').forEach(p=>p.classList.remove('active','frozen'));
});

(function(){const d=new Date();
  document.getElementById('data').value=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();})();

document.getElementById('saveBtn').addEventListener('click',()=>{
  const nome=document.getElementById('nome').value.trim();
  const warn=document.getElementById('nameWarn');
  if(!nome){ warn.textContent='Escreva seu nome antes de salvar o relatório.';
    go(0); document.getElementById('nome').focus(); return; }
  warn.textContent='';
  const slug=nome.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'');
  const old=document.title; document.title='Relatorio_curvas_Hb_'+slug;
  const wasRuler=document.body.classList.contains('ruler'); document.body.classList.remove('ruler');
  window.print();
  if(wasRuler) document.body.classList.add('ruler');
  setTimeout(()=>{document.title=old;},400);
});

render();
</script>
</body>
</html>
