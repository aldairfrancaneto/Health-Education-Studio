<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} img{max-width:100%}</style>
<title>Aprendizagem por investigação clínica</title>
<style>
/* Layout: palco fixo de projeção (1600 × 900 virtuais, escalado para caber na tela sem rolagem).
   Fita do tempo no topo, rebobinada da direita para a esquerda; cartões de prontuário com verso em papel de eletrocardiograma.
   Em telas pequenas (celular), o palco vira página comum com rolagem. */
:root {
  --bg: #eef3f2;
  --paper: #fbfdfc;
  --ink: #14232b;
  --ink-2: #44565f;
  --muted: #6b7c84;
  --line: #cfdcda;
  --accent: #c42f3d;          /* vermelho do papel de eletrocardiograma */
  --accent-soft: #f6dfe1;
  --grid: rgba(196, 47, 61, .16);
  --grid-strong: rgba(196, 47, 61, .32);
  --tape: #1d3440;
  --tape-ink: #e8f0ef;
  --ok: #1d7a4e; --ok-soft: #dcefe5;
  --warn: #b36b00; --warn-soft: #f8ead2;
  --bad: #b3261e; --bad-soft: #f7dcd9;
  --organ: #d8e2e1; --organ-line: #8ea2a6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  /* Fontes do sistema: já instaladas no computador, funcionam sem internet */
  --display: system-ui, "Segoe UI", Roboto, "Ubuntu", "Helvetica Neue", Arial, sans-serif;
  --body: system-ui, "Segoe UI", Roboto, "Ubuntu", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", "Courier New", monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e171b; --paper: #16232a; --ink: #e6eeed; --ink-2: #b3c3c6; --muted: #8fa1a6;
    --line: #2b3d45; --accent: #ff6b72; --accent-soft: #3a1d22;
    --grid: rgba(255, 107, 114, .12); --grid-strong: rgba(255, 107, 114, .26);
    --tape: #08242f; --tape-ink: #e6eeed;
    --ok: #4cc58a; --ok-soft: #12322a; --warn: #f0a83a; --warn-soft: #3a2a10; --bad: #ff7a70; --bad-soft: #3d1a18;
    --organ: #2a3b42; --organ-line: #6d858c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e171b; --paper: #16232a; --ink: #e6eeed; --ink-2: #b3c3c6; --muted: #8fa1a6;
  --line: #2b3d45; --accent: #ff6b72; --accent-soft: #3a1d22;
  --grid: rgba(255, 107, 114, .12); --grid-strong: rgba(255, 107, 114, .26);
  --tape: #08242f; --tape-ink: #e6eeed;
  --ok: #4cc58a; --ok-soft: #12322a; --warn: #f0a83a; --warn-soft: #3a2a10; --bad: #ff7a70; --bad-soft: #3d1a18;
  --organ: #2a3b42; --organ-line: #6d858c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { font-size: 16px; }
html.fit { font-size: 22px; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1rem; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 2rem;
}
html.fit, html.fit body { height: 100%; overflow: hidden; }
html.fit body { padding: 0; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; line-height: 1.12; margin: 0; text-align: center; }
h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
/* Texto corrido justificado, com hifenização em português para evitar espaços grandes */
p, li, dd, figcaption, .lede, .gcs-desc, .synth td, .teacher-note, .reveal-box, .chain .step span:not(.k) { text-align: justify; hyphens: auto; -webkit-hyphens: auto; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--mono); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); text-align: center; display: block; }
img { max-width: 100%; }

/* ---------- Palco ---------- */
#stage { display: flex; flex-direction: column; }
html.fit #stage { position: absolute; transform-origin: 0 0; width: 1600px; height: 900px; background: var(--bg); }

/* ---------- Rodapé (mesmas informações dos outros jogos) ----------
   Fica numa faixa própria abaixo do palco: no modo encaixado o palco encolhe
   para dar lugar a ele (fit() desconta a altura), em vez de a página rolar. */
.site-footer { flex: none; padding: 7px 14px; border-top: 1px solid rgba(255,255,255,.15); background: var(--tape); color: var(--tape-ink); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 12.5px; letter-spacing: .02em; text-align: left; line-height: 1.5; margin: 2rem calc(-1 * max(16px, env(safe-area-inset-left, 0px))) -2rem; }
html.fit .site-footer { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; }
.site-footer-linha { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 2px 14px; color: rgba(232,240,239,.6); }
.site-footer strong { color: rgba(232,240,239,.85); }
.site-footer-verso { margin-left: auto; color: rgba(232,240,239,.5); }
@media (max-width: 600px) { .site-footer { font-size: 11px; padding: 5px 10px; } .site-footer-verso { margin-left: 0; } }
/* Celular deitado: sem rodapé, para o caso ocupar a tela inteira */
@media (pointer: coarse) and (orientation: landscape) { .site-footer { display: none; } }

/* ---------- Fita do tempo ---------- */
.tape { background: var(--tape); color: var(--tape-ink); flex: none; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: .55rem max(16px, env(safe-area-inset-left, 0px)); }
html.fit .tape { margin-inline: 0; padding: .55rem 40px; }
.tape-inner { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 800; font-size: .82rem; letter-spacing: -.01em; display: flex; align-items: center; gap: .5rem; max-width: 15rem; line-height: 1.2; }
.brand .rw { color: var(--accent); font-size: 1.3rem; }
.track { flex: 1 1 520px; min-width: 0; display: grid; grid-template-columns: repeat(5, 1fr); position: relative; }
.track::before { content: ""; position: absolute; left: 10%; right: 10%; top: 13px; height: 3px; background: rgba(255,255,255,.18); }
.track .fill { position: absolute; right: 10%; top: 13px; height: 3px; background: var(--accent); transition: width .6s ease; }
.node { background: none; border: 0; padding: 0; display: grid; justify-items: center; gap: .2rem; position: relative; color: inherit; }
.node .dot { width: 29px; height: 29px; border-radius: 50%; border: 3px solid rgba(255,255,255,.35); background: var(--tape); display: grid; place-items: center; font-size: .72rem; }
.node .when { font-family: var(--mono); font-size: .62rem; opacity: .75; text-align: center; line-height: 1.2; }
.node .what { font-size: .66rem; text-align: center; line-height: 1.2; opacity: .9; }
.node.seen .dot { border-color: var(--accent); background: var(--accent); color: #fff; }
.node.here .dot { box-shadow: 0 0 0 5px rgba(255,107,114,.35); }
.node.locked { cursor: default; }
.node.locked .what { opacity: .45; }
.tools { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
.chip-btn { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); color: var(--tape-ink); border-radius: 999px; padding: .3rem .8rem; font-size: .72rem; }
.chip-on { display: inline-flex; align-items: center; background: var(--accent); color: #fff; border-radius: 999px; padding: .3rem .8rem; font-size: .72rem; font-weight: 700; }

/* ---------- Telas ---------- */
main { padding-top: 1.2rem; }
html.fit main { flex: 1; min-height: 0; padding: 22px 40px 18px; display: flex; }
.screen { display: flex; flex-direction: column; gap: 1rem; flex: 1; min-width: 0; min-height: 0; animation: in .35s ease; }
@keyframes in { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.head { display: grid; grid-template-columns: minmax(0, 1fr); gap: .35rem; margin-inline: auto; width: 100%; flex: none; }
.head h1 { min-width: 0; max-width: 100%; }
.head .lede { text-align: center; }
.lede { font-size: 1.08rem; color: var(--ink-2); }
.body { flex: 1; min-height: 0; min-width: 0; }
html.fit .body { overflow: hidden; }         /* como num slide: o que não couber é reduzido por encaixa(), nunca rolado */
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.2rem; }
.navrow { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; align-items: center; flex: none; }
.navrow .mid { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: .5rem 1rem; font-weight: 700; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { background: transparent; }
.btn-row { display: flex; gap: .6rem; flex-wrap: wrap; }
.btn-row.c { justify-content: center; }
.note { font-size: .85rem; color: var(--muted); }
.tag { display: inline-block; font-family: var(--mono); font-size: .72rem; padding: .1rem .45rem; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.reveal-box { border: 2px dashed var(--accent); border-radius: var(--radius); padding: .9rem 1.1rem; display: grid; gap: .5rem; background: var(--paper); }
.teacher-note { border: 1px dashed var(--accent); border-radius: 8px; padding: .55rem .85rem; font-size: .8rem; color: var(--ink-2); background: var(--paper); }

/* Configuração */
.setup { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 1.2rem 2.4rem; align-items: stretch; }
html.fit .setup { height: 100%; padding: 1rem 1.8rem; }
html.fit .setup-col { align-content: space-evenly; }
.setup-col { display: grid; gap: .8rem; align-content: start; min-width: 0; }
.setup-col + .setup-col { border-left: 1px solid var(--line); padding-left: 2.4rem; }
@media (max-width: 900px) { html:not(.fit) .setup { grid-template-columns: 1fr; } html:not(.fit) .setup-col + .setup-col { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 1.2rem; } }
.count { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
.count button { width: 2.8rem; height: 2.8rem; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); font-family: var(--display); font-weight: 800; font-size: 1.15rem; }
.count button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .35rem 1rem; }
@media (max-width: 480px) { .names { grid-template-columns: 1fr; } }
.names label { display: grid; gap: .15rem; font-size: .82rem; color: var(--muted); }
.names input, .access input { font: inherit; font-size: 1rem; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: .4rem .6rem; width: 100%; }
.access { display: grid; gap: .5rem; }
.access-row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.access input { width: 14rem; max-width: 100%; }
.access .msg { font-size: .88rem; }
.access .msg.bad { color: var(--bad); }
.access .msg.ok { color: var(--ok); font-weight: 700; }
.confirm { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; background: var(--bad-soft); color: var(--bad); padding: .5rem .8rem; border-radius: 8px; }

/* Abertura */
.case-file { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 1.4rem; align-items: stretch; height: 100%; }
@media (max-width: 860px) { html:not(.fit) .case-file { grid-template-columns: 1fr; } }
.death { border-left: 6px solid var(--accent); padding: 1.6rem 1.8rem; background: var(--paper); border-radius: 0 var(--radius) var(--radius) 0; display: grid; gap: 1rem; align-content: center; }
.death .big { font-family: var(--display); font-size: 4rem; font-weight: 800; color: var(--accent); line-height: 1; text-align: center; }
.death p { font-size: 1.3rem; }
.task { display: grid; gap: 1.2rem; align-content: center; padding: 1.6rem 1.8rem; }
.task p { font-size: 1.2rem; }
.question { font-family: var(--display); font-size: 2.8rem; font-weight: 800; text-align: center; }
.adapt { font-size: .9rem !important; color: var(--muted); text-align: center !important; }

/* ---------- Cartões ---------- */
.cards { display: grid; gap: 14px; grid-template-columns: var(--cols, repeat(var(--units, 5), minmax(0, 1fr))); }
html.fit .cards { height: 100%; }
html:not(.fit) .cards { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); align-items: start; }
.card { position: relative; min-height: 200px; perspective: 1400px; }
.card.wide { grid-column: span 2; }
html:not(.fit) .card.wide { grid-column: auto !important; }
html.fit .card { min-height: 0; height: 100%; }
.card-inner { position: relative; height: 100%; min-height: inherit; transition: transform .6s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }
.card.open .card-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; }
html:not(.fit) .card.open .face.front { position: relative; }
.card.open .face.back { pointer-events: none; }
.back {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid-strong) 1px, transparent 1px), linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 40px 40px, 40px 40px, 8px 8px, 8px 8px;
  display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); padding: 1rem 1.1rem; text-align: left; width: 100%;
}
.back .cat { font-family: var(--mono); font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.back .q { font-family: var(--display); font-size: 6rem; font-weight: 800; color: var(--accent); line-height: 1; opacity: .85; align-self: center; justify-self: center; }
.back .hint { font-size: 1rem; line-height: 1.4; background: var(--paper); border: 2px dashed var(--accent); border-radius: 8px; padding: .7rem .8rem; color: var(--ink); text-align: justify; hyphens: auto; -webkit-hyphens: auto; display: grid; gap: .45rem; }
.back .hint b { color: var(--accent); }
.back .hint i { font-style: normal; font-weight: 700; color: var(--ink-2); text-align: left; }
.back:has(.hint) .q { font-size: 3rem; }
.back .lock { font-size: .82rem; color: var(--muted); text-align: center; }
.front { background: var(--paper); transform: rotateY(180deg); padding: .9rem 1rem .55rem; display: flex; flex-direction: column; gap: .55rem; font-size: .86rem; line-height: 1.38; }
html.fit .front { overflow: hidden; }
.front h3 { font-size: 1rem; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word; }
.back .hint { overflow-wrap: break-word; width: 100%; grid-template-columns: minmax(0, 1fr); }
/* Cartões estreitos (bloco com seis cartões): título e dica um pouco menores, como num slide de seis colunas */
.card { container-type: inline-size; }
@container (max-width: 240px) {
  .front h3 { font-size: .8rem; }
  .back .hint { font-size: .8rem; padding: .55rem .6rem; }
  .back:has(.hint) .q { font-size: 2.4rem; }
}
.front .cat { font-family: var(--mono); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: center; }
.flipback { margin-top: auto; align-self: flex-end; flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: .1rem .7rem; font-size: .72rem; color: var(--muted); }
.val { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.val.high { color: var(--bad); }
.lab { display: grid; gap: .45rem; border-top: 1px solid var(--line); padding-top: .45rem; }
.lab .lr { display: grid; gap: .05rem; }
.lab .lv { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 .5rem; }
.lab small { font-size: .74rem; color: var(--muted); }
figure { margin: 0; display: grid; gap: .3rem; }
figcaption { font-size: .74rem; color: var(--muted); line-height: 1.3; }
.ct { position: relative; background: #000; border-radius: 6px; overflow: hidden; display: grid; place-items: center; }
.ct img { max-height: var(--ct-h, 240px); width: auto; display: block; }
.ct .side { position: absolute; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: .7rem; color: #fff; background: rgba(0,0,0,.55); padding: .15rem .35rem; border-radius: 3px; }
.ct .side.l { left: 4px; } .ct .side.r { right: 4px; }
.ecg img { width: 100%; border-radius: 4px; border: 1px solid var(--line); background: #fff; display: block; }
/* Ampliação de imagens: qualquer foto ou exame abre em tela cheia ao clicar */
.zw { position: relative; display: block; cursor: zoom-in; }
.zw:hover img { outline: 2px solid var(--accent); }
.zoom-tag { position: absolute; right: 6px; bottom: 6px; background: var(--ink); color: var(--paper); font-size: .66rem; padding: .05rem .45rem; border-radius: 999px; pointer-events: none; }
.zoom-view { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: .8rem; cursor: zoom-out; }
.zoom-view img { flex: 1 1 auto; min-height: 0; width: 100%; object-fit: contain; }
.zoom-ct { flex: 1 1 auto; min-height: 0; padding-inline: 2.2rem; }
.zoom-ct img { height: 100%; width: auto; max-height: none; flex: none; }
.zoom-ct .side { font-size: 1rem; }
.zoom-view p { font-size: 1.05rem; text-align: center; max-width: 90ch; flex: none; }

/* Glasgow */
.gcs { display: grid; gap: .4rem; }
.gcs-top { display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap; }
.gcs-tabs { display: flex; gap: .4rem; flex-wrap: wrap; }
.gcs-tabs button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: .1rem .8rem; font-size: .78rem; }
.gcs-tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.gcs-desc { background: var(--bg); border-radius: 6px; padding: .4rem .7rem; }
.gcs-row { display: flex; flex-wrap: wrap; gap: .3rem .4rem; align-items: center; }
.gcs-row .lbl { font-weight: 700; font-size: .8rem; margin-right: .2rem; }
.gcs-row .opts { display: contents; }
.opts { display: flex; flex-wrap: wrap; gap: .3rem; }
.opts button { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: .12rem .45rem; font-size: .76rem; text-align: left; }
.opts button .n { font-family: var(--mono); font-weight: 600; margin-right: .25rem; }
.opts button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.opts button.right { outline: 3px solid var(--ok); outline-offset: 1px; }
.gcs-total { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
.gcs-total .num { font-family: var(--display); font-size: 1.7rem; font-weight: 800; line-height: 1; }
.gcs-total .of { color: var(--muted); font-size: .85rem; }
.sum { font-family: var(--mono); font-size: .82rem; padding: .15rem .45rem; border-radius: 4px; white-space: nowrap; }
.sum.ok { background: var(--ok-soft); color: var(--ok); }
.sum.off { background: var(--warn-soft); color: var(--warn); }

/* Régua do INR */
.inr { display: grid; gap: .35rem; }
.inr-bar { position: relative; min-height: 40px; border-radius: 6px; overflow: hidden; display: flex; border: 1px solid var(--line); }
.inr-bar span { display: grid; place-items: center; font-size: .74rem; font-weight: 700; text-align: center; line-height: 1.1; padding: 0 .2rem; }
.z-low { background: var(--warn-soft); color: var(--warn); }
.z-ok { background: var(--ok-soft); color: var(--ok); }
.z-high { background: var(--bad-soft); color: var(--bad); }
.inr-bar .z-high { justify-items: start; padding-left: .7rem; text-align: left; }
.inr-scale { position: relative; height: 1.1rem; font-family: var(--mono); font-size: .72rem; color: var(--muted); margin-inline: 6px; }
.inr-scale i { position: absolute; transform: translateX(-50%); font-style: normal; }
.inr-x { position: absolute; top: calc(1.4rem - 6px); height: 52px; width: 4px; background: var(--ink); border-radius: 2px; transform: translateX(-50%); transition: left 1.1s cubic-bezier(.3,.7,.2,1); }
.inr-x b { position: absolute; top: -1.5rem; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); font-family: var(--mono); font-size: .78rem; padding: .05rem .4rem; border-radius: 4px; white-space: nowrap; }
.inr-wrap { position: relative; padding-top: 1.6rem; }

/* ---------------- Palco: escala para caber na tela ---------------- */
const stage = $("#stage");
function fit() {
  const w = window.innerWidth;
  const on = w >= 760 && window.innerHeight >= 430;
  document.documentElement.classList.toggle("fit", on);
  if (on) {
    const h = window.innerHeight - (document.getElementById("rodape")?.offsetHeight || 0);   // o rodapé tem faixa própria embaixo
    const s = Math.min(w / 1600, h / 900);
    stage.style.width = w / s + "px"; stage.style.height = h / s + "px";
    stage.style.transform = `scale(${s})`; stage.style.left = "0px"; stage.style.top = "0px";
  } else {
    stage.style.width = stage.style.height = stage.style.transform = stage.style.left = stage.style.top = "";
  }
}
window.addEventListener("resize", () => { fit(); fitTitles(document); });
if (window.ResizeObserver) new ResizeObserver(() => { fit(); fitTitles(document); }).observe(document.getElementById("rodape"));   // rodapé quebrando linha

const alTotal = () => SECOES.length + 2;           // identificação + seções + relatório
const alLiberada = (i) => i === 0 || (i <= SECOES.length ? (i === 1 || !!S.aluno.lib[SECOES[i - 2].id]) : !!S.aluno.lib[SECOES[SECOES.length - 1].id]);
const alMembros = () => S.aluno.integrantes.map((n) => n.trim()).filter(Boolean);
const alIdOk = () => !!S.aluno.grupo.trim() && alMembros().length > 0;
function alResp(sid, q) { return ((S.aluno.resp[sid] || {})[q]) || ""; }
function alNav(nextLabel, canNext) {
  const i = S.aluno.at;
  return `<div class="navrow">
    ${i > 0 ? `<button class="btn ghost" data-act="al-prev">← Voltar</button>` : "<span></span>"}<span></span>
    ${i < alTotal() - 1 ? `<button class="btn primary" data-act="al-next" ${canNext ? "" : "disabled"}>${nextLabel || "Avançar"} →</button>` : "<span></span>"}
  </div>`;
}
function telaAluno() {
  const A = S.aluno, i = A.at;
  if (i === 0) return `<section class="screen">
    ${head("Modo aluno", "Identificação do grupo", "O nome do grupo e dos integrantes aparecem no minirrelatório. As respostas ficam guardadas neste navegador.")}
    <div class="body" style="display:grid;align-content:center"><div class="panel al-id">
      <label for="al-grupo">Nome do grupo<input id="al-grupo" data-al="grupo" value="${esc(A.grupo)}" autocomplete="off"></label>
      <fieldset class="al-members"><legend>Integrantes (nome completo)</legend>
        ${A.integrantes.map((n, k) => `<input id="al-int-${k}" data-int="${k}" value="${esc(n)}" autocomplete="off" aria-label="Integrante ${k + 1}" placeholder="Integrante ${k + 1}">`).join("")}
      </fieldset>
    </div></div>
    ${alNav("Começar", true)}
  </section>`;
  if (i === alTotal() - 1) {
    const qs = SECOES.flatMap((s) => s.qs.map((q) => alResp(s.id, q[0]).trim()));
    const feitas = qs.filter(Boolean).length;
    return `<section class="screen">
      ${head("Fim da atividade", "Meu minirrelatório", `Você respondeu ${feitas} de ${qs.length} perguntas. Volte às seções se quiser completar alguma resposta.`)}
      <div class="body" style="display:grid;gap:1.2rem;align-content:center;max-width:62rem;margin-inline:auto;width:100%">
        <div class="al-sum">${SECOES.map((s) => { const n = s.qs.filter((q) => alResp(s.id, q[0]).trim()).length; return `<div><span>${s.titulo}</span><b class="${n === s.qs.length ? "ok" : ""}">${n} de ${s.qs.length}</b></div>`; }).join("")}</div>
        ${alIdOk() ? "" : `<p class="msg" style="color:var(--bad);text-align:center">Falta a identificação do grupo. Volte à primeira tela antes de salvar.</p>`}
        <div class="btn-row c"><button class="btn primary" data-act="al-pdf" style="font-size:1.15rem;padding:.7rem 1.6rem">Salvar em PDF</button></div>
        <p class="note" style="text-align:center">Na janela de impressão que vai abrir, escolha <strong>“Salvar como PDF”</strong> no campo de destino ou impressora.</p>
      </div>
      ${alNav()}
    </section>`;
  }
  const s = SECOES[i - 1], lib = !!A.lib[s.id];
  if (!lib) return `<section class="screen">
    ${head(s.eyebrow, s.titulo)}
    <div class="body" style="display:grid"><div class="al-lock">
      <span class="big" aria-hidden="true">🔒</span>
      <p>Esta seção ainda está fechada. Quando a turma chegar a esta parte, o professor vai passar um código. Digite-o abaixo.</p>
      <div class="access-row" style="justify-content:center"><input data-code aria-label="Código da seção" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Código">
      <button class="btn primary" data-act="al-code">Liberar</button></div>
      ${alMsg ? `<span class="msg">${alMsg}</span>` : ""}
    </div></div>
    ${alNav("Avançar", false)}
  </section>`;
  const rows = s.qs.length > 1 ? 6 : 10;
  return `<section class="screen">
    ${head(s.eyebrow, s.titulo)}
    <div class="body"><div class="al-body">
      ${s.qs.map(([q, txt, fig]) => {
        const caixa = `<textarea id="r-${s.id}-${q}" data-resp="${s.id}:${q}" rows="${rows}">${esc(alResp(s.id, q))}</textarea>`;
        return `<div class="al-q"><label for="r-${s.id}-${q}">${txt}</label>
        ${fig ? `<div class="al-fig"><div class="al-figs">${fig()}</div>${caixa}</div>` : caixa}</div>`;
      }).join("")}
    </div></div>
    ${alNav(i === alTotal() - 2 ? "Ver o minirrelatório" : "Próxima seção", true)}
  </section>`;
}
function renderAluno() {
  const A = S.aluno;
  const steps = S.modo === "aluno" ? `<nav class="al-steps" aria-label="Seções do modo aluno">${Array.from({ length: alTotal() }, (_, i) => {
    const ok = i === 0 ? alIdOk() : i === alTotal() - 1 ? false : !!A.lib[SECOES[i - 1].id];
    const lbl = i === 0 ? "Grupo" : i === alTotal() - 1 ? "Relatório" : String(i);
    return `<button class="${ok ? "ok" : ""} ${A.at === i ? "here" : ""}" data-al-go="${i}" ${alLiberada(i) ? "" : "disabled"} aria-label="${i === 0 ? "Identificação" : i === alTotal() - 1 ? "Minirrelatório" : SECOES[i - 1].titulo}">${lbl}</button>`;
  }).join("")}</nav>` : `<div style="flex:1"></div>`;
  $("#tape").innerHTML = `<div class="tape-inner">
    <div class="brand"><span class="rw" aria-hidden="true">◀◀</span> ${NOME}</div>${steps}
    <div class="tools">${S.modo ? `<button class="chip-btn" data-act="trocar-modo">Trocar modo</button>` : ""}</div>
  </div>`;
  $("#main").innerHTML = S.modo === "aluno" ? telaAluno() : telaModos();
  fitTitles($("#main"));
  markZoom($("#main"));
  window.scrollTo(0, 0);
  const f = document.querySelector("#main [data-pass], #main [data-code]");
  if (f) f.focus();
}
function alGo(i) {
  if (i < 0 || i >= alTotal() || !alLiberada(i)) return;
  S.aluno.at = i; alMsg = ""; save(); renderAluno();
}
function alCode(input) {
  const s = SECOES[S.aluno.at - 1];
  if (!s || !input) return;
  if (normCod(input.value) === codigo(s)) { S.aluno.lib[s.id] = true; alMsg = ""; }
  else alMsg = "Código incorreto. Confira com o professor e tente de novo.";
  save(); renderAluno();
}
function alPdf() {
  const A = S.aluno, hoje = new Date().toLocaleDateString("pt-BR");

  window.addEventListener("afterprint", fim);

function glasgowHTML(t) {
  const cas = GCS_CASE[t], sel = S.gcs[t] || {}, chk = S.gcsCheck[t];
  const tot = ["eyes", "verbal", "motor"].reduce((a, k) => a + (sel[k] || 0), 0);
  const done = ["eyes", "verbal", "motor"].every((k) => sel[k]);
  const ok = done && ["eyes", "verbal", "motor"].every((k) => sel[k] === cas.ans[k]);
  return `<div class="gcs">
    <div class="gcs-top"><span class="tag">${cas.tab}</span>
    <div class="gcs-total"><span class="num">${done ? tot : "–"}</span><span class="of">de 15</span>
      <button class="btn" data-act="gcs-check" data-gcs-case="${t}" style="font-size:.78rem;padding:.25rem .7rem">Conferir</button></div></div>
    <div class="gcs-desc">${cas.desc}</div>
    ${Object.entries(GCS).map(([k, g]) => `<div class="gcs-row"><span class="lbl">${g.lbl}</span><div class="opts">
      ${g.o.map(([n, txt]) => `<button data-gcs="${t}:${k}:${n}" aria-pressed="${sel[k] === n}" class="${chk && cas.ans[k] === n ? "right" : ""}"><span class="n">${n}</span>${txt}</button>`).join("")}
    </div></div>`).join("")}
    ${done || chk ? `<div class="gcs-total">
      ${done ? `<span class="tag">${tot <= 8 ? "3 a 8: grave (coma)" : tot <= 12 ? "9 a 12: moderado" : "13 a 15: leve"}</span>` : ""}
      ${chk ? `<span class="${ok ? "sum ok" : "sum off"}">${ok ? "Correto!" : `Resposta: ${cas.ans.eyes} + ${cas.ans.verbal} + ${cas.ans.motor} = ${cas.ans.eyes + cas.ans.verbal + cas.ans.motor}`}</span>` : ""}
    </div>` : ""}
  </div>`;
}

let overlay = null, ovPage = 0, zoom = null, codeView = null;
function openZoom(img) {
  const fig = img.closest("figure"), cap = fig && fig.querySelector("figcaption");
  zoom = { src: img.src, alt: img.alt, cap: cap ? cap.textContent : img.alt, ct: !!img.closest(".ct"), back: overlay, page: ovPage };
  overlay = "zoom"; renderOverlay();
}
const pausaFeita = (k) => !!S.visto["pausaFim-" + k];
const pausaPendente = () => { const b = BLOCOS[S.tela]; return b && b.pausa && !pausaFeita(b.pausa) ? b.pausa : null; };
function closeOverlay() {
  const era = overlay;
  if (overlay === "zoom" && zoom) { overlay = zoom.back; ovPage = zoom.page; zoom = null; }
  else if (overlay === "codigo" && codeView) { overlay = codeView.back; ovPage = codeView.page; codeView = null; }
  else { overlay = null; loginMsg = ""; }
  renderOverlay();
  if (PAUSAS[era] && !overlay) render(true);         // atualiza o botão da pausa e o "Rebobinar"
}
/* Envolve cada imagem com o selo de ampliar */
function markZoom(root) {
  root.querySelectorAll("img").forEach((img) => {
    if (img.closest(".zoom-view") || img.parentElement.classList.contains("zw")) return;
    const w = document.createElement("span"); w.className = "zw"; w.title = "Clique para ampliar";
    img.replaceWith(w); w.append(img);
    const t = document.createElement("span"); t.className = "zoom-tag"; t.textContent = "🔍 Ampliar"; w.append(t);
  });
}
function openOverlay(kind) { overlay = kind; ovPage = 0; if (PAUSAS[kind]) { S.visto["pausa-" + kind] = true; save(); } renderOverlay(); }
function ovTop(eyebrow, pg) {
  return `<div class="ov-top"><span class="eyebrow" style="text-align:left">${eyebrow}</span><span class="pg">${pg || ""}</span><button class="btn x" data-act="close-ov">Fechar e voltar ao caso</button></div>`;
}
function renderOverlay() {
  const ov = $("#overlay");
  if (!overlay) { ov.hidden = true; ov.innerHTML = ""; return; }
  let html;
  if (PAUSAS[overlay]) {
    const p = PAUSAS[overlay], n = p.paginas.length;
    if (ovPage === n - 1 && !pausaFeita(overlay)) { S.visto["pausaFim-" + overlay] = true; save(); }
    const sc = apres() && SECOES.find((s) => s.pausa === overlay);
    html = `<div class="ov">${ovTop(p.nome, `${ovPage + 1} de ${n}${sc ? ` · <button class="btn" data-act="show-code" data-sec="${sc.id}" style="font-size:.8rem;padding:.2rem .7rem;color:var(--accent)">🔑 Mostrar código dos alunos</button>` : ""}`)}${p.paginas[ovPage]()}
      <div class="navrow">${ovPage > 0 ? `<button class="btn ghost" data-act="ov-prev">← Anterior</button>` : "<span></span>"}<span></span>
      ${ovPage < n - 1 ? `<button class="btn primary" data-act="ov-next">Próxima →</button>` : `<button class="btn primary" data-act="close-ov">Voltar ao caso</button>`}</div></div>`;
  } else if (overlay === "zoom") {
    html = `<div class="ov"><div class="ov-top"><span class="eyebrow" style="text-align:left">Imagem ampliada</span><span></span><button class="btn x" data-act="close-ov">Fechar</button></div>
      <div class="zoom-view" data-act="close-ov">${zoom.ct
        ? `<div class="ct zoom-ct"><img src="${zoom.src}" alt="${esc(zoom.alt)}"><span class="side l">D</span><span class="side r">E</span></div>`
        : `<img src="${zoom.src}" alt="${esc(zoom.alt)}">`}
      ${zoom.cap ? `<p>${esc(zoom.cap)}</p>` : ""}
      <p class="note">Clique na imagem ou aperte Esc para voltar.</p></div></div>`;
  } else if (overlay === "codigo" && codeView && apres()) {
    const s = SECOES.find((x) => x.id === codeView.sec);
    html = `<div class="ov"><div class="ov-top"><span class="eyebrow" style="text-align:left">Código para os alunos</span><span></span><button class="btn x" data-act="close-ov">Fechar</button></div>
      <div class="body"><div class="code-view">
        <span class="eyebrow">${s.eyebrow}</span>
        <div class="code-big">${codigo(s)}</div>
        <p>No modo aluno, digitem este código para liberar a seção <strong>“${s.titulo}”</strong>.</p>
      </div></div></div>`;
  } else if (overlay === "codigos" && apres()) {
    html = `<div class="ov">${ovTop("Modo apresentação")}${head("", "Códigos do modo aluno", "Aparecem só os códigos das etapas que a turma já alcançou. Maiúsculas, minúsculas e acentos não fazem diferença.")}
      <div class="body" style="display:grid;align-content:center"><table class="codes-table"><thead><tr><th>Nº</th><th>Momento da aula</th><th>Seção do aluno</th><th>Código</th></tr></thead>
      <tbody>${SECOES.map((s, i) => alcancada(s)
        ? `<tr><td>${i + 1}</td><td>${s.quando}</td><td>${s.titulo}</td><td class="c">${codigo(s)}</td></tr>`
        : `<tr class="futura"><td>${i + 1}</td><td>${s.quando}</td><td>—</td><td>🔒 Ainda não alcançada</td></tr>`).join("")}</tbody></table></div></div>`;
  } else if (overlay === "login") {
    html = `<div class="ov">${ovTop("Acesso do professor")}<div class="body" style="display:grid"><div class="panel login-box" style="display:grid;gap:.8rem">
      <h2>Modo professor</h2>
      <p>Mostra no verso de cada cartão a pergunta que o libera e permite fechar cartões já abertos.</p>
      ${accessHTML("ov")}</div></div></div>`;
  } else {
    html = `<div class="ov">${ovTop("Consulta rápida")}${head("", "Glossário")}<div class="body"><dl class="gloss">${GLOSS.map(([t, d]) => `<div><dt>${t}</dt><dd>${d}</dd></div>`).join("")}</dl></div></div>`;
  }
  ov.innerHTML = html; ov.hidden = false;
  initInr(ov);
  fitTitles(ov);
  markZoom(ov);
  if (overlay === "login") { const el = ov.querySelector("[data-pass]"); if (el) el.focus(); }
}

/* ---------------- Render ---------------- */
function render(keep) {
  if (S.modo !== "apresentacao" && S.modo !== "professor") { save(); renderAluno(); return; }
  S.visto[S.tela] = true; S.visto[base(S.tela)] = true;
  save();
  renderTape();
  const t = S.tela;
  const html =
    t === "config" ? telaConfig() :
    t === "abertura" ? telaAbertura() :
    t === "abertura-r" ? telaRewind("m0", "20 de novembro de 2000 · Primeiro palpite", "Qual foi a causa da morte?", "Cada grupo escreve o palpite no modo aluno.", "Rebobinar para os últimos dias") :
    BLOCOS[t] ? telaBloco(t) :
    t.endsWith("-r") && BLOCOS[base(t)] ? (() => {
      const b = BLOCOS[base(t)];
      const nx = { b1: "Rebobinar para a chegada", b2: "Rebobinar para os meses anteriores", b3: "Rebobinar para o começo", b4: "Rodar a fita para frente" }[base(t)];
      return telaRewind("m" + b.n, `Bloco ${b.n} · Rebobinar`, b.rebobinar, "Antes de voltar no tempo, cada grupo escreve a previsão no modo aluno.", nx,
        b.guardar ? `<div class="reveal-box" style="flex:none;text-align:center;padding:.4rem 1rem"><strong>${b.guardar}</strong></div>` : "");
    })() :
    t === "fita" ? telaFita() :
    t.startsWith("necro") ? telaNecro(Number(t.split("-")[1])) :
    t.startsWith("final") ? telaFinal() :
    t === "sintese" ? telaSintese() : telaFontes();
  const body = $("#main .body"), y = keep && body ? body.scrollTop : 0, wy = window.scrollY;
  $("#main").innerHTML = html;
  initInr($("#main"));
  fitTitles($("#main"));
  markZoom($("#main"));
  const nb = $("#main .body");
  if (keep) { if (nb) nb.scrollTop = y; window.scrollTo(0, wy); } else window.scrollTo(0, 0);
}

/* Títulos longos: reduz a letra até caber numa linha usando toda a largura (mínimo 1,55rem) */
function fitTitles(root) {
  if (!document.documentElement.classList.contains("fit")) return;
  root.querySelectorAll(".head h1").forEach((h) => {
    h.style.fontSize = ""; h.style.whiteSpace = "nowrap";
    let size = parseFloat(getComputedStyle(h).fontSize);
    const min = 1.55 * parseFloat(getComputedStyle(document.documentElement).fontSize);
    while (h.scrollWidth > h.clientWidth && size > min) { size -= 1; h.style.fontSize = size + "px"; }
    if (h.scrollWidth > h.clientWidth) h.style.whiteSpace = "";
  });
  encaixa(root);
}
/* Slide sem rolagem: se o conteúdo de uma tela ou de um cartão aberto não couber, reduz tudo por igual até caber (mínimo 60%) */
function encaixa(root, depois) {
  if (!document.documentElement.classList.contains("fit")) return;
  if (!depois) requestAnimationFrame(() => requestAnimationFrame(() => encaixa(root, true)));   // confere de novo quando a tela já estiver desenhada
  root.querySelectorAll(".body, .card.open .face.front").forEach((box) => {
    const kids = [...box.children];
    kids.forEach((k) => { k.style.zoom = ""; });
    let z = 1;
    for (let n = 0; n < 12 && box.scrollHeight > box.clientHeight + 1 && z > 0.6; n++) {
      z = Math.max(0.6, z * Math.max(0.9, Math.min(0.99, box.clientHeight / box.scrollHeight)));
      kids.forEach((k) => { k.style.zoom = z; });
    }
  });
  root.querySelectorAll("img").forEach((img) => { if (!img.complete) img.addEventListener("load", () => encaixa(root, true), { once: true }); });
}
function initInr() {}

function go(tela) {
  if (!tela || !TELAS.includes(tela)) return;
  S.tela = tela; render();
}
function step(d) {
  if (d > 0 && pausaPendente()) { openOverlay(pausaPendente()); return; }   // não deixa pular a pausa didática
  if (d > 0 && S.tela === "fita" && !S.fitaAberta) return;                  // a fita é revelada antes de seguir
  const i = TELAS.indexOf(S.tela) + d; if (i >= 0 && i < TELAS.length) go(TELAS[i]);
}
function profKey() { if (S.prof) { S.prof = false; S.modo = "apresentacao"; render(true); } else { loginMsg = ""; openOverlay("login"); } }

/* ---------------- Eventos ---------------- */
document.addEventListener("click", (e) => {
  const zi = e.target.closest(".zw");
  if (zi) { openZoom(zi.querySelector("img")); return; }
  const b = e.target.closest("button, [data-org], .zoom-view");
  if (!b) return;
  const d = b.dataset;
  if (d.modo) {
    if (d.modo === "professor") { modoLogin = true; loginMsg = ""; render(); return; }
    S.modo = d.modo; S.prof = false; modoLogin = false; render(); return;
  }
  if (d.alGo !== undefined) { alGo(Number(d.alGo)); return; }
  if (d.go !== undefined) { if (d.go) go(d.go); return; }
  if (d.open) {
    if (S.abertos[d.open]) return;
    S.abertos[d.open] = true; render(true);
    const el = document.querySelector(`[data-card="${d.open}"]`);
    if (el) { el.classList.remove("open"); void el.offsetWidth; el.classList.add("open"); }
    return;
  }
  if (d.close) { delete S.abertos[d.close]; render(true); return; }
  if (d.pausa) { openOverlay(d.pausa); return; }
  if (d.gcs) { const [c, k, n] = d.gcs.split(":"); S.gcs[c] = S.gcs[c] || {}; S.gcs[c][k] = Number(n); render(true); return; }
  if (d.org) {
    if (b.disabled) return;
    if (d.org === "coracao" || S.necro.acesos.includes(d.org)) { S.necro.sel = d.org; render(true); }
    return;
  }
  switch (d.act) {
    case "next": step(1); break;
    case "prev": step(-1); break;
    case "prof-off": S.prof = false; S.modo = "apresentacao"; render(true); break;
    case "trocar-modo": S.modo = ""; S.prof = false; modoLogin = false; loginMsg = ""; overlay = null; zoom = codeView = null; renderOverlay(); render(); break;
    case "show-code": if (apres()) { codeView = { sec: d.sec, back: overlay, page: ovPage }; overlay = "codigo"; renderOverlay(); } break;
    case "codes": if (apres()) openOverlay("codigos"); break;
    case "al-prev": alGo(S.aluno.at - 1); break;
    case "al-next": alGo(S.aluno.at + 1); break;
    case "al-code": alCode(b.parentElement.querySelector("[data-code]")); break;
    case "al-pdf": alPdf(); break;
    case "prof-login": tryLogin(b.parentElement.querySelector("[data-pass]")); break;
    case "gloss": openOverlay("gloss"); break;
    case "close-ov": closeOverlay(); break;
    case "ov-next": ovPage++; renderOverlay(); break;
    case "ov-prev": ovPage--; renderOverlay(); break;
    case "gcs-check": S.gcsCheck[d.gcsCase] = true; render(true); break;
    case "fita-next": S.fita++; render(true); break;
    case "fita-reset": S.fita = 0; render(true); break;
    case "fita-start": S.fitaAberta = true; S.fita = 1; render(true); break;
    case "organ-next": { const nx = ORDEM_ORGAOS.find((k) => !S.necro.acesos.includes(k)); if (nx) { S.necro.acesos.push(nx); S.necro.sel = nx; } render(true); break; }
    case "final-rev": S.finalRev = true; render(true); break;
    case "p2-rev": S.pausa2Rev = true; renderOverlay(); save(); break;
    case "ask-reset": $("#reset-area").innerHTML = `<div class="confirm"><span>Apagar todos os registros dos grupos e voltar ao início?</span><button class="btn" data-act="do-reset">Sim, apagar</button><button class="btn ghost" data-act="cancel-reset">Cancelar</button></div>`; break;
    case "cancel-reset": render(true); break;
    case "do-reset": { const p = S.prof, md = S.modo, al = S.aluno; S = fresh(); S.prof = p; S.modo = md; S.aluno = al; render(); break; }
  }
});

document.addEventListener("input", (e) => {
  const el = e.target, d = el.dataset;
  if (d.gname !== undefined) { S.grupos[Number(d.gname)] = el.value; save(); return; }
  if (d.al) { S.aluno[d.al] = el.value; save(); return; }
  if (d.int !== undefined) { S.aluno.integrantes[Number(d.int)] = el.value; save(); return; }
  if (d.resp) { const [sid, q] = d.resp.split(":"); (S.aluno.resp[sid] = S.aluno.resp[sid] || {})[q] = el.value; save(); return; }
});

document.addEventListener("keydown", (e) => {
  const tg = e.target instanceof Element ? e.target : document.body;
  if (tg.matches("[data-pass]") && e.key === "Enter") { e.preventDefault(); tryLogin(tg); return; }
  if (tg.matches("[data-code]") && e.key === "Enter") { e.preventDefault(); alCode(tg); return; }
  if (e.key === "Escape" && overlay) { closeOverlay(); return; }
  if (tg.matches("input, textarea")) return;
  if (overlay && PAUSAS[overlay]) {
    if (e.key === "ArrowRight" && ovPage < PAUSAS[overlay].paginas.length - 1) { ovPage++; renderOverlay(); }
    else if (e.key === "ArrowLeft" && ovPage > 0) { ovPage--; renderOverlay(); }
    return;
  }
  if (overlay) return;
  if (S.modo !== "apresentacao" && S.modo !== "professor") return;
  if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "p" || e.key === "P") profKey();
  else if (e.key === "g" || e.key === "G") openOverlay("gloss");
});

fit();
render();
})();
</script>

</body>
</html>
